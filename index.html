<script>/* content/sql2.js */
/* SQL — módulos 5 a 8: expressões, alterando dados, modelagem, avançado */
(function (TD) {
  'use strict';
  const { learn, quiz, predict, code, lesson, unit } = TD.C;
  const sql = TD.courses.find((c) => c.id === 'sql');

  sql.units.push(
    unit('Expressões',
      lesson('sql-case', 'CASE',
        learn('if/else dentro do SQL', `\`CASE\` cria valores condicionais:

~~~
SELECT name, price,
  CASE
    WHEN price >= 500 THEN 'premium'
    WHEN price >= 100 THEN 'mid'
    ELSE 'budget'
  END AS tier
FROM products;
~~~

Combinado com agregação, faz contagens condicionais (pivot simples):

~~~
SELECT
  SUM(CASE WHEN status = 'delivered' THEN 1 ELSE 0 END) AS delivered,
  SUM(CASE WHEN status = 'canceled'  THEN 1 ELSE 0 END) AS canceled
FROM orders;
~~~`),
          quiz('Se nenhum WHEN bate e não há ELSE, o CASE retorna o quê?', ["''", '0', 'NULL', 'Dá erro'], 2, 'Sem ELSE, o resultado é NULL.'),
          predict('Para um cliente de 30 anos, o que sai?', "CASE\n  WHEN age < 30 THEN 'young'\n  WHEN age < 50 THEN 'adult'\n  ELSE 'senior'\nEND", ["'young'", "'adult'", "'senior'", 'NULL'], 1, '30 não é < 30, então pula pro próximo WHEN: 30 < 50 → adult. O primeiro WHEN verdadeiro ganha.'),
          code({ title: 'Faixa etária', task: 'Mostre `name` e uma column `age_group` com: `\'young\'` (menos de 30), `\'adult\'` (30 a 49) e `\'senior\'` (50+).',
            starter: '-- write your query\n', solution: "SELECT name, CASE WHEN age < 30 THEN 'young' WHEN age < 50 THEN 'adult' ELSE 'senior' END AS age_group FROM customers;", checkColumns: true, hint: 'Teste do menor pro maior: `WHEN age < 30 THEN ... WHEN age < 50 THEN ... ELSE ...`.' })),

        lesson('sql-functions', 'Funções de texto e COALESCE',
          learn('Tratando valores', `Funções úteis (SQLite; os nomes são parecidos em outros bancos):

~~~
UPPER(name), LOWER(name)
LENGTH(name)
SUBSTR(name, 1, 3)               -- 3 caracteres a partir do 1º
TRIM(text)
REPLACE(email, '@mail', '@corp')
name || ' - ' || country          -- concatenação (CONCAT em outros bancos)
ROUND(price * 1.1, 2)
COALESCE(email, 'no email')       -- primeiro valor não nulo
~~~

\`COALESCE\` é a forma padrão de trocar NULL por um valor padrão.`),
          quiz('O que `COALESCE(NULL, NULL, \'x\')` retorna?', ['NULL', "'x'", 'Erro', "''"], 1, 'Retorna o primeiro argumento não nulo.'),
          predict('O que sai?', "SELECT COALESCE(NULL, NULL, 'x', 'y');", ['NULL', "'x'", "'y'", 'Erro'], 1, 'COALESCE devolve o primeiro valor que não é NULL.'),
          code({ title: 'Contatos', task: 'Mostre `name` em maiúsculas como `customer` e o email como `contact`, trocando email nulo por `\'no email\'`.',
            starter: '-- write your query\n', solution: "SELECT UPPER(name) AS customer, COALESCE(email, 'no email') AS contact FROM customers;", checkColumns: true, hint: "`UPPER(name) AS customer, COALESCE(email, 'no email') AS contact`" })),

        lesson('sql-dates', 'Datas',
          learn('Trabalhando com tempo', `No SQLite, datas costumam ser texto ISO (\`'2026-03-15'\`), que ordena certinho. Funções:

~~~
date('now')                         -- hoje
strftime('%Y', created_at)          -- ano: '2026'
strftime('%Y-%m', created_at)       -- ano-mês: '2026-03'
date(created_at, '+30 days')        -- soma dias
julianday('2026-12-25') - julianday('2026-12-20')   -- diferença: 5.0
~~~

Em PostgreSQL o equivalente é \`EXTRACT(YEAR FROM ...)\`, \`DATE_TRUNC('month', ...)\` e \`+ INTERVAL '30 days'\`. O raciocínio é o mesmo.`),
          quiz("O que `strftime('%m', '2026-04-30')` retorna?", ["'04'", "'30'", "'2026'", '4'], 0, '`%m` é o mês com dois dígitos.'),
          quiz("O que `strftime('%Y-%m', '2026-03-15')` retorna no SQLite?", ["'2026-03-15'", "'2026-03'", "'03'", "'2026'"], 1, '%Y é o ano, %m o mês: 2026-03.'),
          code({ title: 'Vendas por mês', task: 'Ignorando cancelados, mostre o mês (`\'YYYY-MM\'`) como `month` e a soma de `amount` como `revenue`, em ordem cronológica.',
            starter: '-- write your query\n', solution: "SELECT strftime('%Y-%m', created_at) AS month, SUM(amount) AS revenue FROM orders WHERE status <> 'canceled' GROUP BY month ORDER BY month;", ordered: true, checkColumns: true, hint: "`strftime('%Y-%m', created_at) AS month` e `GROUP BY month`." }))
    ),

    unit('Alterando dados',
      lesson('sql-insert', 'INSERT',
        learn('Adicionando rows', `~~~
INSERT INTO customers (id, name, country, age)
VALUES (11, 'Lea Braun', 'Austria', 27);

-- várias de uma vez
INSERT INTO products (id, name, category, price) VALUES
  (9, 'USB Hub', 'Peripherals', 25.0),
  (10, 'Mic', 'Audio', 99.0);
~~~

Sempre liste as columns: o código continua funcionando se a table ganhar columns novas. Columns omitidas recebem NULL (ou o DEFAULT).`),
        quiz('Por que listar as columns no INSERT?', ['É obrigatório', 'Deixa explícito e não quebra se a table mudar', 'Fica mais rápido', 'Pra evitar NULL'], 1, 'Sem a lista, o INSERT depende da ordem exata de todas as columns.'),
        code({ title: 'Novo cliente', task: 'Insira o customer `id 11`, `name \'Lea Braun\'`, `country \'Austria\'`, `city \'Vienna\'`, `age 27` (sem email).',
          starter: '-- write your INSERT\n', solution: "INSERT INTO customers (id, name, country, city, age) VALUES (11, 'Lea Braun', 'Austria', 'Vienna', 27);",
          check: 'SELECT id, name, country, city, age, email FROM customers ORDER BY id;', ordered: true, hint: 'Liste as 5 columns e os 5 valores na mesma ordem.' })),

      lesson('sql-update-delete', 'UPDATE e DELETE',
        learn('Alterando e apagando', `~~~
UPDATE customers
SET age = 30, city = 'Campinas'
WHERE id = 1;

DELETE FROM orders
WHERE status = 'canceled';
~~~

**Muito cuidado**: \`UPDATE\` ou \`DELETE\` sem \`WHERE\` afeta **todas** as rows. Dica profissional: escreva primeiro um \`SELECT\` com o mesmo WHERE, confira as rows, e só então troque por UPDATE/DELETE.`),
        quiz('O que `DELETE FROM orders;` faz?', ['Nada, falta WHERE', 'Apaga a table', 'Apaga todas as rows da table', 'Dá erro'], 2, 'Sem WHERE, apaga todas as rows (a table continua existindo).'),
        code({ title: 'Faxina', task: 'Faça duas coisas:\n\n1. Aumente em 10% o `price` de todos os produtos da categoria `\'Audio\'`.\n2. Apague os orders com status `\'canceled\'`.',
          starter: '-- 1. UPDATE\n\n-- 2. DELETE\n', solution: "UPDATE products SET price = price * 1.1 WHERE category = 'Audio';\nDELETE FROM orders WHERE status = 'canceled';",
          check: "SELECT (SELECT GROUP_CONCAT(ROUND(price, 2), ',') FROM (SELECT price FROM products ORDER BY id)) AS prices, (SELECT COUNT(*) FROM orders) AS orders_left, (SELECT COUNT(*) FROM orders WHERE status = 'canceled') AS canceled_left;",
          hint: "`SET price = price * 1.1 WHERE category = 'Audio'` e `DELETE FROM orders WHERE status = 'canceled'`." })),

      lesson('sql-transactions', 'Transações',
        learn('Tudo ou nada', `Uma **transaction** agrupa comandos que precisam acontecer juntos. Ou tudo dá certo (\`COMMIT\`), ou nada fica (\`ROLLBACK\`):

~~~
BEGIN;
UPDATE accounts SET balance = balance - 100 WHERE id = 1;
UPDATE accounts SET balance = balance + 100 WHERE id = 2;
COMMIT;
~~~

Se o sistema cair entre os dois UPDATEs sem transaction, o dinheiro some. Com transaction, o banco garante **ACID**: Atomicidade, Consistência, Isolamento e Durabilidade.

Constraints (como \`CHECK (balance >= 0)\`) ajudam: se uma operação violar a regra, ela falha e você faz rollback.`),
        quiz('O que o ROLLBACK faz?', ['Confirma as mudanças', 'Desfaz tudo desde o BEGIN', 'Apaga a table', 'Repete a transação'], 1, 'Volta o banco ao estado de antes do BEGIN.'),
        code({ db: 'bank', title: 'Transferência', task: 'Numa transaction, transfira **150** da conta da `Ana` (id 1) pra conta da `Marta` (id 3).',
          starter: '-- BEGIN; ... COMMIT;\n', solution: 'BEGIN;\nUPDATE accounts SET balance = balance - 150 WHERE id = 1;\nUPDATE accounts SET balance = balance + 150 WHERE id = 3;\nCOMMIT;',
          check: 'SELECT id, owner, balance FROM accounts ORDER BY id;', ordered: true, requires: [['Usa BEGIN e COMMIT', '\\bBEGIN\\b[\\s\\S]*\\bCOMMIT\\b']], hint: 'Dois UPDATEs entre `BEGIN;` e `COMMIT;`.' }))
    ),

    unit('Modelagem',
      lesson('sql-create-table', 'CREATE TABLE',
        learn('Criando tables', `~~~
CREATE TABLE tasks (
  id INTEGER PRIMARY KEY,
  title TEXT NOT NULL,
  done INTEGER NOT NULL DEFAULT 0,
  created_at TEXT DEFAULT CURRENT_TIMESTAMP
);
~~~

- **PRIMARY KEY**: identifica cada row de forma única.
- **NOT NULL**: obrigatório.
- **DEFAULT**: valor quando não informado.
- Tipos comuns: \`INTEGER\`, \`REAL\`, \`TEXT\`, \`BLOB\` (no PostgreSQL: \`SERIAL\`, \`NUMERIC\`, \`VARCHAR\`, \`BOOLEAN\`, \`TIMESTAMP\`...).

Pra mudar depois: \`ALTER TABLE tasks ADD COLUMN priority INTEGER;\`. Pra apagar: \`DROP TABLE tasks;\`.`),
        quiz('O que PRIMARY KEY garante?', ['Que a column é a primeira', 'Que cada valor é único e identifica a row', 'Que o valor é positivo', 'Que a table é ordenada'], 1, 'Chave primária: única e não nula.'),
        code({ title: 'Tabela de cursos', task: 'Crie a table `courses` com:\n\n- `id` INTEGER PRIMARY KEY\n- `title` TEXT NOT NULL\n- `hours` INTEGER NOT NULL\n- `level` TEXT',
          starter: '-- CREATE TABLE courses (...)\n', solution: 'CREATE TABLE courses (\n  id INTEGER PRIMARY KEY,\n  title TEXT NOT NULL,\n  hours INTEGER NOT NULL,\n  level TEXT\n);',
          check: "SELECT name, UPPER(type) AS type, \"notnull\", pk FROM pragma_table_info('courses') ORDER BY cid;", ordered: true, hint: 'Uma column por linha, separadas por vírgula.' })),

      lesson('sql-constraints', 'Chaves estrangeiras e constraints',
        learn('Regras no próprio banco', `**Foreign key** garante que uma referência aponta pra algo que existe:

~~~
CREATE TABLE reviews (
  id INTEGER PRIMARY KEY,
  product_id INTEGER NOT NULL REFERENCES products(id),
  rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
  comment TEXT,
  UNIQUE (product_id, id)
);
~~~

- \`REFERENCES\`: chave estrangeira
- \`CHECK\`: regra de validação
- \`UNIQUE\`: sem valores repetidos

**Normalização**: não repita dados. Em vez de guardar o nome do cliente em cada pedido, guarde o \`customer_id\` e faça JOIN. Se o nome mudar, muda num lugar só.`),
        quiz('Por que guardar `customer_id` no pedido em vez do nome do cliente?', ['Ocupa menos espaço só', 'Evita duplicação e inconsistência (normalização)', 'Porque nomes não podem ser texto', 'É obrigatório no SQL'], 1, 'Um dado, um lugar: atualizações não deixam versões conflitantes.'),
        code({ title: 'Avaliações', task: 'Crie a table `reviews` com:\n\n- `id` INTEGER PRIMARY KEY\n- `product_id` INTEGER NOT NULL, chave estrangeira pra `products(id)`\n- `rating` INTEGER NOT NULL com `CHECK` entre 1 e 5\n- `comment` TEXT',
          starter: '-- CREATE TABLE reviews (...)\n', solution: 'CREATE TABLE reviews (\n  id INTEGER PRIMARY KEY,\n  product_id INTEGER NOT NULL REFERENCES products(id),\n  rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),\n  comment TEXT\n);',
          check: "SELECT (SELECT GROUP_CONCAT(name || ':' || UPPER(type) || ':' || \"notnull\", ',') FROM pragma_table_info('reviews')) AS columns, (SELECT COUNT(*) FROM pragma_foreign_key_list('reviews') WHERE \"table\" = 'products') AS fks, (SELECT sql LIKE '%CHECK%' FROM sqlite_master WHERE name = 'reviews') AS has_check;",
          hint: '`product_id INTEGER NOT NULL REFERENCES products(id)` e `rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5)`.' })),

      lesson('sql-indexes', 'Índices',
        learn('Deixando consultas rápidas', `Sem índice, buscar \`WHERE customer_id = 8\` lê a table inteira (**full scan**). Um **índice** é como o índice remissivo de um livro:

~~~
CREATE INDEX idx_orders_customer ON orders (customer_id);
~~~

- Primary keys já têm índice.
- Indexe columns muito usadas em WHERE, JOIN e ORDER BY.
- Índices custam: ocupam espaço e deixam INSERT/UPDATE um pouco mais lentos.

Pra ver o plano de execução: \`EXPLAIN QUERY PLAN SELECT ...\` (no PostgreSQL: \`EXPLAIN ANALYZE\`). "SCAN" = leu tudo; "SEARCH ... USING INDEX" = usou índice.`),
        quiz('Qual a desvantagem de criar índices demais?', ['Nenhuma', 'Escritas mais lentas e mais espaço', 'SELECTs mais lentos', 'Perda de dados'], 1, 'Cada índice precisa ser atualizado a cada escrita.'),
        code({ title: 'Indexando pedidos', task: 'Crie um índice na column `customer_id` da table `orders` (o nome do índice é livre).',
          starter: '-- CREATE INDEX ...\n', solution: 'CREATE INDEX idx_orders_customer ON orders (customer_id);',
          check: "SELECT ii.name AS col FROM pragma_index_list('orders') il JOIN pragma_index_info(il.name) ii WHERE il.origin = 'c' ORDER BY col;", hint: '`CREATE INDEX nome ON orders (customer_id);`' })),

      lesson('sql-views', 'Views',
        learn('Queries com nome permanente', `Uma **view** salva uma query com nome. Você consulta como se fosse uma table:

~~~
CREATE VIEW active_orders AS
SELECT * FROM orders WHERE status IN ('pending', 'shipped');

SELECT COUNT(*) FROM active_orders;
~~~

Views escondem complexidade (JOINs, filtros) e dão uma interface estável pra relatórios. Os dados não são copiados: a query roda toda vez.`),
        quiz('Uma view guarda os dados?', ['Sim, é uma cópia', 'Não, guarda a query; os dados vêm das tables na hora', 'Só se tiver índice', 'Só no PostgreSQL'], 1, 'Views comuns são queries salvas. (Existem "materialized views", que guardam.)'),

~~~

  RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rank_in_dept
FROM employees;
~~~

- \`OVER (...)\` define a "janela".

- Ranking: \`ROW_NUMBER()\` (1,2,3), \`RANK()\` (1,1,3 em empates), \`DENSE_RANK()\` (1,1,2).

        code({ db: 'hr', title: 'Ranking por departamento', task: 'Mostre `name`, `dept_id`, `salary` e `rank_in_dept` (posição do salário dentro do departamento, maior = 1, usando `RANK()`).',

Outras funções úteis:

- \`AVG(...) OVER (ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)\`: média móvel`),

        code({ title: 'Faturamento acumulado', task: 'Para os pedidos **delivered**, mostre `id`, `created_at`, `amount` e `running_total` (soma acumulada de amount em ordem de `created_at`), ordenado por `created_at`.',
          starter: '-- write your query\n', solution: "SELECT id, created_at, amount, SUM(amount) OVER (ORDER BY created_at) AS running_total FROM orders WHERE status = 'delivered' ORDER BY created_at;", ordered: true, checkColumns: true,
          hint: '`SUM(amount) OVER (ORDER BY created_at) AS running_total`' })),

      lesson('sql-union', 'UNION',

~~~

- \`UNION ALL\` mantém tudo (e é mais rápido).

Também existem \`INTERSECT\` (o que está nas duas) e \`EXCEPT\` (o que está na primeira e não na segunda).`),
        quiz('Qual a diferença entre UNION e UNION ALL?', ['Nenhuma', 'UNION remove duplicatas; UNION ALL mantém', 'UNION ALL remove duplicatas', 'UNION só aceita 2 queries'], 1, 'UNION faz um DISTINCT no resultado.'),
        code({ title: 'Cidades', task: 'Liste todas as cidades (sem repetir) que aparecem em customers do país `\'Germany\'` **ou** em pedidos com status `\'pending\'` (cidade do cliente do pedido). Uma column: `city`.',
          starter: '-- write your query\n', solution: "SELECT city FROM customers WHERE country = 'Germany'\nUNION\nSELECT c.city FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.status = 'pending';", checkColumns: true,
          requires: [['Usa UNION', '\\bUNION\\b']], hint: 'Duas queries com uma column `city` cada, juntas por `UNION`.' })),

Monte em etapas com CTEs, confira cada uma, e só então junte. Arredonde valores com \`ROUND(x, 2)\`.`),
        code({ title: 'Relatório por país', task: 'Ignorando pedidos cancelados, mostre por `country`:\n\n- `buyers`: clientes distintos que compraram\n- `revenue`: soma de amount, `ROUND(..., 2)`\n- `avg_ticket`: média de amount por pedido, `ROUND(..., 2)`\n\nOrdene por `revenue` decrescente.',
          starter: '-- write your query\n', solution: "WITH valid AS (\n  SELECT o.*, c.country FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.status <> 'canceled'\n)\nSELECT country, COUNT(DISTINCT customer_id) AS buyers, ROUND(SUM(amount), 2) AS revenue, ROUND(AVG(amount), 2) AS avg_ticket\nFROM valid GROUP BY country ORDER BY revenue DESC;",
          ordered: true, checkColumns: true, hint: '`COUNT(DISTINCT customer_id)`, `ROUND(SUM(amount), 2)` e `ROUND(AVG(amount), 2)`, agrupando por country depois do JOIN.' }))
    )
  );

          code({ title: 'Minha stack', task: 'Crie uma `<ul>` com 3 itens: `HTML`, `CSS` e `JavaScript`. Abaixo, uma `<ol>` com 2 passos quaisquer.',

        lesson('web-document', 'O documento HTML',

- \`<head>\`: informações sobre a página (título, CSS, metadados de SEO). Não aparece.

Neste app, o editor já vive dentro de um \`<body>\`, então você escreve só o conteúdo.`),

        lesson('web-a11y', 'Acessibilidade',
          learn('Web pra todo mundo', `Acessibilidade (a11y) é fazer a página funcionar com leitor de tela, teclado e para quem enxerga pouco.

O básico já resolve muito:

        lesson('web-validation', 'Validação nativa',
          learn('O browser valida pra você', `HTML tem validação embutida, sem JavaScript:

~~~

<script>/* store.js */
/* Persistência do Trilha Dev (mesmo modelo do Deutsch mit Plan).
 * Backends com a mesma interface get/set/del/list:
 *  - DbBackend: banco do artifact no Claude.ai (privado por usuário)
 *  - NativeBackend: arquivo JSON no PC (Electron), com cópias diárias automáticas
 *  - MemoryBackend: navegador (localStorage), para o app instalado/PWA
 * Backups: exportar/restaurar JSON com checksum + backup automático semanal (guarda 4). */
(function (TD) {
  'use strict';
  const SCHEMA = 1;
  const APP = 'trilha-dev';
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16); }
  function stable(o) {
    if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']';
    if (o && typeof o === 'object') return '{' + Object.keys(o).filter((k) => o[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + stable(o[k])).join(',') + '}';
    return JSON.stringify(o);
  }

  /* Caminhos lógicos: 'progress' | 'code/c/<lessonId>' | 'backups/b/<id>' */
  function DbBackend(db, uid) {
    const base = 'data/users/' + uid;
    const ref = (path) => { const s = path.split('/'); return s.length === 1 ? db.doc(base + '/' + s[0]) : db.doc(base + '/' + s[0]).collection(s[1]).doc(s[2]); };
    const withRetry = async (fn) => { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } };
    return {
      kind: 'db',
      async get(path) { const s = await withRetry(() => ref(path).get()); return s.exists ? clone(s.data()) : null; },
      async set(path, data) { return withRetry(() => ref(path).set(data)); },
      async del(path) { return withRetry(() => ref(path).delete()); },
      async list(coll) {
        const [a, b] = coll.split('/');
        const snap = await withRetry(() => db.doc(base + '/' + a).collection(b).limit(1000).get());
        return snap.docs.map((d) => ({ id: d.id, data: clone(d.data()) }));
      }
    };
  }
  function MemoryBackend(persistKey) {
    let mem = {};

<script>/* local.js */
/* Adaptadores para rodar FORA do Claude.ai (programa de PC ou app no navegador).
 * Mesma interface das capacidades do Claude: o resto do app não muda. */
(function (TD) {

  const KEY = 'td-ai-settings';

  function aiSettings() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }

  async function post(key, body) {
    if (window.tdNative && window.tdNative.anthropic) return window.tdNative.anthropic(key, body);
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(body)

    return { status: r.status, json };
  }

  /** Tutor via API da Anthropic com a chave do próprio usuário (fica só neste aparelho, fora dos backups). */
  function makeSample() {
    const cfg = aiSettings();
    if (!cfg.key) return null;
    const sample = async (prompt, opts) => {
      const res = await post(cfg.key, { model: cfg.model || 'claude-haiku-5-5', max_tokens: 700, messages: [{ role: 'user', content: prompt }] });
      if (res.status === 401) throw { code: 'not_granted', message: 'Chave de API inválida.' };
      if (res.status === 429) throw { code: 'rate_limited', message: 'Limite de uso atingido.' };

      const text = ((res.json && res.json.content) || []).filter((c) => c.type === 'text').map((c) => c.text).join('');
      if (opts && opts.onText) opts.onText({ text, delta: text });
      return { text, truncated: false };
    };
    sample.local = true;
    return sample;
  }

    const res = await post(key, { model: model || 'claude-haiku-5-5', max_tokens: 5, messages: [{ role: 'user', content: 'Say: ok' }] });
    if (res.status !== 200) throw new Error((res.json && res.json.error && res.json.error.message) || 'erro ' + res.status);
    return true;
  }

  function makeDownloads() {
    return {
      async save({ filename, data }) {
        if (window.tdNative && window.tdNative.saveFile) { const ok = await window.tdNative.saveFile(filename, data); if (!ok) throw { code: 'dismissed' }; return; }

  }

    res.typeErrors = mine.map((d) => (d.line ? 'Line ' + d.line + ': ' : '') + d.msg);
    return res;
  }

  /* ---------- SQL: sql.js (build asm, sem wasm) ---------- */
  let sqlPromise = null;
  function loadSQL() {
    if (!sqlPromise) {
      sqlPromise = (window.initSqlJs ? Promise.resolve() : loadScript(VENDOR.sql))
        .then(() => window.initSqlJs())
        .catch((e) => { sqlPromise = null; throw e; });
    }
    return sqlPromise;
  }
  function lastResult(db, sql) { const r = db.exec(sql); return r.length ? r[r.length - 1] : null; }
  const norm = (v) => (typeof v === 'number' ? Math.round(v * 1e4) / 1e4 : v);
  function rowsKey(result, ordered) {
    if (!result) return '[]';
    const rows = result.values.map((r) => JSON.stringify(r.map(norm)));
    if (!ordered) rows.sort();
    return rows.join('|');
  }
  async function runSQL(code, step, course) {
    const SQL = await loadSQL();
    const setup = (course.setups && course.setups[step.db || 'shop']) || '';
    const results = [];
    let table = null, error = null, info = null, mine = null;
    const userDb = new SQL.Database();
    userDb.run(setup);
    try {
      if (!code.replace(/--.*$/gm, '').trim()) throw new Error('Escreva uma query antes de rodar.');
      const last = lastResult(userDb, code);
      mine = step.check ? lastResult(userDb, step.check) : last;
      table = mine;
      if (!last && !step.check) info = 'A query rodou, mas não retornou nenhuma row.';
    } catch (e) { error = e.message || String(e); }
    const refDb = new SQL.Database();
    refDb.run(setup);
    let ref;
    if (step.check) { refDb.exec(step.solution); ref = lastResult(refDb, step.check); } else ref = lastResult(refDb, step.solution);
    userDb.close(); refDb.close();
    const sameCount = !error && mine && ref && mine.values.length === ref.values.length && mine.columns.length === ref.columns.length;
    const sameRows = sameCount && rowsKey(mine, step.ordered) === rowsKey(ref, step.ordered);
    if (step.check) results.push({ name: 'O banco ficou com os dados esperados', pass: !!sameRows });
    else {
      results.push({ name: `Retorna ${ref ? ref.values.length : 0} rows e ${ref ? ref.columns.length : 0} columns`, pass: !!sameCount });
      results.push({ name: step.ordered ? 'Valores certos, na ordem certa' : 'Valores certos', pass: !!sameRows });
      if (step.checkColumns) {
        const ok = !error && mine && ref && mine.columns.map((c) => c.toLowerCase()).join(',') === ref.columns.map((c) => c.toLowerCase()).join(',');
        results.push({ name: 'Columns com os nomes: ' + (ref ? ref.columns.join(', ') : ''), pass: !!ok });
      }
    }
    return { output: info ? [info] : null, table, results: results.concat(srcChecks(step, code)), error, expectedTable: ref };
  }

  /* ---------- HTML/CSS e DOM: iframe srcdoc de mesma origem ---------- */
  function wrapHTML(code) {
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>
      window.__logs = [];
      (function () {
        var f = function (v) { if (typeof v === 'string') return v; try { return JSON.stringify(v); } catch (e) { return String(v); } };
        var log = function () { window.__logs.push(Array.prototype.map.call(arguments, f).join(' ')); };
        console.log = log; console.info = log; console.warn = log; console.error = log;
        window.addEventListener('error', function (e) { window.__logs.push('Error: ' + e.message); window.__err = e.message; });
        window.alert = function (m) { window.__logs.push('[alert] ' + m); };
      })();
    <\/script><style>
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; color: #1b1f24; background: #ffffff; line-height: 1.45; }
      img { max-width: 100%; }
    </style></head><body>${code}</body></html>`;
  }
  function runWeb(code, step, frame) {
    const tests = step.tests || [];
    return new Promise((resolve) => {
      let done = false;
      const finish = async () => {
        if (done) return; done = true;
        let doc = null, win = null;
        try { doc = frame.contentDocument; win = frame.contentWindow; } catch (e) { /* sem acesso */ }
        if (!doc) { resolve({ output: null, results: tests.map((t) => ({ name: t[0], pass: false })), error: 'Não foi possível inspecionar o preview.' }); return; }
        const $ = (s) => doc.querySelector(s);
        const $$ = (s) => Array.from(doc.querySelectorAll(s));
        const css = (el, prop) => (el ? win.getComputedStyle(el).getPropertyValue(prop).trim() : '');
        const rules = () => { const out = []; const walk = (list, media) => { for (const r of Array.from(list || [])) { if (r.cssRules && r.media) walk(r.cssRules, r.media.mediaText); else if (r.selectorText) out.push({ sel: r.selectorText, media: media || '', text: r.cssText }); } }; for (const s of Array.from(doc.styleSheets)) { try { walk(s.cssRules); } catch (e) { /* */ } } return out; };
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const results = [];
        for (const [name, expr] of tests) {
          try {
            const fn = new Function('$', '$$', 'css', 'doc', 'win', 'rules', 'wait', '__src', 'return (async () => (' + expr + '))();');
            results.push({ name, pass: !!(await fn($, $$, css, doc, win, rules, wait, code)) });
          } catch (e) { results.push({ name, pass: false, err: e.message }); }
        }
        const logs = (win.__logs || []).slice();
        resolve({ output: logs, results: results.concat(srcChecks(step, code)), error: win.__err ? 'Error: ' + win.__err : null, preview: true });
      };
      frame.onload = () => setTimeout(finish, 60);
      frame.srcdoc = wrapHTML(code);
      setTimeout(finish, 3000);
    });
  }

  TD.runners = { runJS, runTS, runSQL, runWeb, loadTS, loadSQL, wrapHTML, MINI_LIB };
})(globalThis.TD = globalThis.TD || {});

</script>
<script>/* pedagogy.js */
/* Método Trilha: o motor pedagógico. Vale pra QUALQUER trilha, inclusive as que forem criadas no futuro,
 * porque trabalha só com o formato das lições (learn / quiz / predict / code) e nunca com uma linguagem específica.
 *
 * Base em pesquisa (detalhes em PEDAGOGIA.md):
 *  - Segmentação / carga cognitiva: teoria em cartões pequenos, revelados um de cada vez.
 *  - Worked examples: a teoria da lição fica à mão durante o exercício.
 *  - Parsons problems: "montar com blocos" gerado da solução, como ajuda (Hou & Ericson).
 *  - PRIMM: passos "prever a saída" antes de escrever código.
 *  - Retrieval practice + spacing: revisão espaçada automática (caixas de Leitner).
 *  - Interleaving: revisões e checkpoints misturam assuntos.
 *  - Mastery learning: checkpoint por módulo antes de liberar o próximo.
 *  - Mensagens de erro explicadas (Becker). */
(function (TD) {
  'use strict';
  const DAY = 86400000;
  const INTERVALS = [1, 3, 7, 14, 30, 60]; // dias por caixa
  const CHECKPOINT_PASS = 0.7;
  const REVIEW_CAP = 12;

  /* ---------- 1. teoria em cartões ---------- */
  const words = (s) => (s.replace(/(~~~|```)[\s\S]*?(~~~|```)/g, ' ').match(/\S+/g) || []).length;
  function chunkBody(body) {
    const parts = String(body).split(/((?:~~~|```)[a-z]*\n[\s\S]*?(?:~~~|```))/);
    const blocks = [];
    parts.forEach((p, i) => {
      if (i % 2 === 1) blocks.push({ code: true, text: p });
      else p.split(/\n{2,}/).map((b) => b.trim()).filter(Boolean).forEach((b) => blocks.push({ code: false, text: b }));
    });
    const chunks = []; let cur = [];
    const close = () => { if (cur.length) { chunks.push(cur.map((b) => b.text).join('\n\n')); cur = []; } };
    for (const b of blocks) {
      cur.push(b);
      const textWords = cur.filter((x) => !x.code).reduce((a, x) => a + words(x.text), 0);
      if (b.code || textWords > 70) close();
    }
    if (cur.length) {
      const w = cur.reduce((a, x) => a + words(x.text), 0);
      if (chunks.length && w < 25) chunks[chunks.length - 1] += '\n\n' + cur.map((b) => b.text).join('\n\n');
      else close();
    }
    return chunks.length ? chunks : [String(body)];
  }

  /* ---------- 2. Parsons: montar com blocos ---------- */
  function seeded(seed) { let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
  function parsonsBlocks(step, seed) {
    const lines = String(step.solution || '').split('\n').filter((l) => l.trim() !== '');
    if (lines.length < 2 || lines.length > 28) return null;
    const blocks = lines.map((text, i) => ({ id: 'b' + i, text }));
    const rnd = seeded(seed || step.title || 'x');
    const order = blocks.slice();
    for (let tries = 0; tries < 6; tries++) {
      for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      if (order.some((b, i) => b.id !== blocks[i].id)) break;
    }
    return order;
  }

  /* ---------- 3. mensagens de erro explicadas ---------- */
  const ERRORS = {
    js: [
      [/is not defined/, 'Você usou um nome que não existe. Confira se escreveu igualzinho (maiúsculas contam) e se criou a variável ou function antes de usar.'],
      [/Assignment to constant variable/, 'Você tentou mudar o valor de uma `const`. Se o valor precisa mudar, declare com `let`.'],
      [/has already been declared/, 'Você declarou o mesmo nome duas vezes. Use `let`/`const` só na primeira vez; depois é só `nome = valor`.'],
      [/is not a function/, 'Você chamou com `()` algo que não é function. Confira o nome do method (ex: `toUpperCase`, não `toUppercase`).'],
      [/Cannot read propert(y|ies) of (undefined|null)/, 'Você tentou ler uma property de algo que é `undefined`/`null`. O valor antes do ponto não existe: mostre ele com `console.log` ou use `?.`.'],
      [/Unexpected end of input/, 'O código terminou "no meio": provavelmente falta fechar uma `}` ou `)`.'],
      [/missing \) after argument list/, 'Falta fechar um parêntese `)` ou separar argumentos com vírgula.'],
      [/Invalid or unexpected token|Unterminated string/, 'Tem uma aspa aberta sem fechar, ou um caractere estranho. Confira as aspas `"`, `\'` e a crase.'],
      [/Unexpected (token|identifier|string|number)/, 'Erro de sintaxe: sobrou ou faltou algum símbolo (vírgula, parêntese, chave, aspas). Olhe a linha e a anterior.'],
      [/Maximum call stack/, 'Uma function chamou a si mesma sem parar. Confira o caso base da recursão.'],
      [/loop infinito/, 'Algum loop nunca termina. Confira se a condição do `while`/`for` em algum momento fica `false`.']
    ],
    ts: [
      [/is not assignable to (type|parameter)/, 'O valor não bate com o tipo declarado. Compare o tipo do valor com o tipo que você anotou.'],
      [/implicitly has an 'any' type/, 'Faltou anotar o tipo desse parâmetro: escreva `nome: tipo` (ex: `width: number`).'],
      [/Cannot find name/, 'Esse nome não existe. Confira a grafia e se você declarou o type/interface/variável.'],
      [/Property '.+' does not exist on type/, 'Essa property não existe nesse tipo. Confira o nome ou adicione a property na interface.'],
      [/is missing the following properties|is missing in type/, 'Faltam properties obrigatórias no object. Confira a interface.'],
      [/Unused '@ts-expect-error' directive/, 'Um teste de tipo esperava um erro e ele não aconteceu: seu tipo está aceitando valores que deveria recusar.'],
      [/lacks ending return statement|Not all code paths return a value/, 'Algum caminho da function termina sem `return`. Trate todos os casos.']
    ],
    sql: [
      [/no such column/, 'Essa column não existe. Confira o nome na descrição do banco (e o alias da table, como `c.name`).'],
      [/no such table/, 'Essa table não existe. Confira o nome na descrição do banco.'],
      [/ambiguous column name/, 'A column existe nas duas tables do JOIN. Diga de qual é, com o alias: `c.id` ou `o.id`.'],
      [/misuse of aggregate/, 'Você usou `COUNT`/`SUM`/`AVG` no `WHERE`. Condições sobre aggregates vão no `HAVING`.'],
      [/UNIQUE constraint failed/, 'Já existe uma row com esse valor (ex: o mesmo `id`). Use outro valor.'],
      [/NOT NULL constraint failed/, 'Uma column obrigatória ficou sem valor. Inclua ela no INSERT.'],
      [/CHECK constraint failed/, 'O valor viola uma regra `CHECK` da table (ex: saldo negativo).'],
      [/incomplete input/, 'O comando terminou no meio: falta fechar um parêntese ou uma aspa.'],
      [/syntax error/, 'Erro de sintaxe SQL. Confira: vírgula entre columns, texto em aspas simples e a ordem SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.']
    ],
    web: [], dom: []
  };
  ERRORS.dom = ERRORS.js;
  function explainError(runner, msg) {
    if (!msg) return null;
    const list = (ERRORS[runner] || []).concat(runner === 'ts' ? ERRORS.js : []);
    const hit = list.find(([re]) => re.test(msg));
    return hit ? hit[1] : null;
  }

  /* ---------- 4. revisão espaçada (Leitner) ---------- */
  const isPracticeStep = (s) => s.t === 'quiz' || s.t === 'predict' || s.t === 'code';
  function schedule(item, correct, now) {
    const box = correct ? Math.min((item ? item.box : 0) + 1, INTERVALS.length - 1) : 0;
    return { box, due: now + INTERVALS[box] * DAY, seen: ((item && item.seen) || 0) + 1, last: correct ? 1 : 0 };
  }
  function enrollLesson(progress, lesson, results, now) {
    progress.srs = progress.srs || {};
    lesson.steps.forEach((s, i) => {
      if (!isPracticeStep(s)) return;
      const key = lesson.id + '#' + i;
      if (progress.srs[key] && results[i] === undefined) return;
      progress.srs[key] = results[i] === undefined ? { box: 0, due: now + DAY, seen: 0 } : schedule(progress.srs[key], results[i], now);
    });
  }
  function findStep(courses, key) {
    const [lid, idx] = key.split('#');
    for (const c of courses) for (const u of c.units) for (const l of u.lessons) if (l.id === lid) return { c, l, step: l.steps[Number(idx)], i: Number(idx) };
    return null;
  }
  function dueItems(progress, courses, now) {
    const srs = progress.srs || {};
    const due = Object.keys(srs).filter((k) => srs[k].due <= now).map((k) => ({ key: k, ...findStep(courses, k), meta: srs[k] })).filter((x) => x.step);
    due.sort((a, b) => a.meta.due - b.meta.due);
    // interleaving: alterna entre trilhas e lições
    const byCourse = {}; due.forEach((d) => (byCourse[d.c.id] = byCourse[d.c.id] || []).push(d));
    const out = []; const queues = Object.values(byCourse);
    while (out.length < REVIEW_CAP && queues.some((q) => q.length)) for (const q of queues) if (q.length && out.length < REVIEW_CAP) out.push(q.shift());
    return out;
  }
  function nextDue(progress) {
    const v = Object.values(progress.srs || {}).map((x) => x.due);
    return v.length ? Math.min(...v) : null;
  }

  /* ---------- 5. checkpoint do módulo (mastery + interleaving) ---------- */
  const unitKey = (c, ui) => c.id + '-u' + ui;
  function checkpointLesson(c, ui, seed) {
    const u = c.units[ui];
    const rnd = seeded('cp' + c.id + ui + (seed || ''));
    const refs = [];
    u.lessons.forEach((l) => l.steps.forEach((s, i) => { if (s.t === 'quiz' || s.t === 'predict') refs.push({ l, s, i }); }));
    const codes = [];
    u.lessons.forEach((l) => l.steps.forEach((s, i) => { if (s.t === 'code' && parsonsBlocks(s, 'x')) codes.push({ l, s, i }); }));
    const pick = (arr, n) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
    const chosen = pick(refs, 6).concat(pick(codes, 2));
    const steps = pick(chosen, chosen.length).map((x) => Object.assign({}, x.s, { _from: x.l.id + '#' + x.i, _fromTitle: x.l.title, _blocks: x.s.t === 'code' }));
    if (!steps.length) return null;
    return { id: unitKey(c, ui) + '-check', title: 'Checkpoint: ' + u.title, steps, checkpoint: { course: c.id, unit: ui } };
  }
  function unitMastered(progress, c, ui) {
    const m = (progress.mastery || {})[unitKey(c, ui)];
    return !!m && m.best >= CHECKPOINT_PASS;
  }

  TD.ped = { chunkBody, parsonsBlocks, explainError, schedule, enrollLesson, dueItems, nextDue, checkpointLesson, unitMastered, unitKey, isPracticeStep, words, CHECKPOINT_PASS, INTERVALS, DAY };
})(globalThis.TD = globalThis.TD || {});

</script>
<script>/* sfx.js */
/* Efeitos sonoros do Trilha Dev: sintetizados na hora com Web Audio (nenhum arquivo de áudio).
 * Estética synth/neon: blips de interface, arpejos, ruído filtrado e eco. */
(function (TD) {
  'use strict';
  let ctx = null, master = null, echo = null, noiseBuf = null;
  let enabled = true, volume = 0.6;
  let lastHover = 0;

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = volume;
    master.connect(comp); comp.connect(ctx.destination);
    // eco curto (delay com feedback) pros sons "grandes"
    const d = ctx.createDelay(1); d.delayTime.value = 0.16;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    echo = ctx.createGain(); echo.gain.value = 0.35;
    echo.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function ready() {
    if (!enabled) return null;
    const c = init(); if (!c) return null;
    if (c.state === 'suspended') c.resume().catch(() => {});
    return c;
  }

  function tone({ f = 440, to = null, type = 'square', dur = 0.08, vol = 0.2, at = 0, attack = 0.004, wet = false, cutoff = 6000, detune = 0 }) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain(), flt = c.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    flt.type = 'lowpass'; flt.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(flt); flt.connect(g); g.connect(master); if (wet) g.connect(echo);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise({ dur = 0.1, vol = 0.15, at = 0, from = 800, to = 800, q = 4, type = 'bandpass', wet = false }) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + at;
    const s = c.createBufferSource(), g = c.createGain(), flt = c.createBiquadFilter();
    s.buffer = noiseBuf;
    flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(from, t); flt.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(master); if (wet) g.connect(echo);
    s.start(t); s.stop(t + dur + 0.02);
  }

  const N = (semi) => 440 * Math.pow(2, (semi - 9) / 12); // semitons a partir do C4
  const SFX = {
    click() { tone({ f: 1850, to: 1200, type: 'square', dur: 0.035, vol: 0.06, cutoff: 4000 }); noise({ dur: 0.02, vol: 0.03, from: 5000, to: 3000 }); },
    hover() { const n = performance.now(); if (n - lastHover < 70) return; lastHover = n; tone({ f: 2600, type: 'sine', dur: 0.025, vol: 0.025 }); },
    select() { tone({ f: 900, to: 1400, type: 'triangle', dur: 0.06, vol: 0.08 }); },
    nav() { tone({ f: 420, to: 840, type: 'sawtooth', dur: 0.09, vol: 0.05, cutoff: 2200 }); noise({ dur: 0.12, vol: 0.04, from: 600, to: 3500, q: 2 }); },
    run() { noise({ dur: 0.28, vol: 0.11, from: 300, to: 4200, q: 6 }); tone({ f: 220, to: 660, type: 'sawtooth', dur: 0.22, vol: 0.05, cutoff: 1800 }); },
    correct() {
      [0, 4, 7, 12].forEach((s, i) => tone({ f: N(12 + s), type: 'square', dur: 0.11, vol: 0.07, at: i * 0.055, cutoff: 3500, wet: true }));
      tone({ f: N(36), type: 'sine', dur: 0.35, vol: 0.04, at: 0.2, wet: true });
    },
    wrong() {
      tone({ f: 150, to: 70, type: 'square', dur: 0.26, vol: 0.12, cutoff: 900 });
      tone({ f: 157, to: 74, type: 'sawtooth', dur: 0.26, vol: 0.08, cutoff: 900 });
      [0, 0.06, 0.13].forEach((at) => noise({ dur: 0.04, vol: 0.12, at, from: 1800, to: 900, q: 1.5 }));
    },
    pass() {
      tone({ f: N(19), type: 'sawtooth', dur: 0.18, vol: 0.06, cutoff: 2600, wet: true });
      tone({ f: N(26), type: 'sawtooth', dur: 0.22, vol: 0.05, at: 0.07, cutoff: 3000, wet: true });
      tone({ f: N(31), type: 'square', dur: 0.3, vol: 0.05, at: 0.14, cutoff: 4000, wet: true });
      noise({ dur: 0.3, vol: 0.05, from: 2000, to: 8000, q: 1, at: 0.05 });
    },
    complete() {
      tone({ f: N(-12), to: N(-24), type: 'sawtooth', dur: 0.5, vol: 0.1, cutoff: 700 });
      const seq = [0, 3, 7, 10, 12, 15, 19, 24];
      seq.forEach((s, i) => tone({ f: N(12 + s), type: i % 2 ? 'square' : 'sawtooth', dur: 0.14, vol: 0.06, at: 0.08 + i * 0.07, cutoff: 3000 + i * 300, wet: true }));
      tone({ f: N(24), type: 'triangle', dur: 0.9, vol: 0.07, at: 0.7, wet: true });
      tone({ f: N(31), type: 'triangle', dur: 0.9, vol: 0.05, at: 0.7, wet: true });
      noise({ dur: 0.6, vol: 0.05, from: 800, to: 9000, q: 1, at: 0.05 });
    },
    rankup() {
      noise({ dur: 0.5, vol: 0.12, from: 200, to: 6000, q: 3 });
      tone({ f: N(-24), to: N(-12), type: 'sawtooth', dur: 0.6, vol: 0.12, cutoff: 900 });
      [0, 7, 12, 16, 19, 24, 28, 31].forEach((s, i) => tone({ f: N(12 + s), type: 'square', dur: 0.16, vol: 0.06, at: 0.45 + i * 0.06, cutoff: 5000, wet: true }));
    },
    boot() {
      noise({ dur: 0.35, vol: 0.06, from: 150, to: 2500, q: 5 });
      [0, 7, 12].forEach((s, i) => tone({ f: N(s), type: 'sawtooth', dur: 0.12, vol: 0.05, at: 0.12 + i * 0.08, cutoff: 2000, wet: true }));
    },
    toggle(on) { tone({ f: on ? 700 : 1200, to: on ? 1400 : 600, type: 'square', dur: 0.08, vol: 0.07, cutoff: 3000 }); }
  };

  TD.sfx = {
    play(name, arg) { if (!enabled) return false; try { if (!SFX[name]) return false; SFX[name](arg); return true; } catch (e) { return false; } },
    unlock() { if (enabled) ready(); },
    configure({ on, vol }) {
      if (typeof on === 'boolean') enabled = on;
      if (typeof vol === 'number') { volume = Math.max(0, Math.min(1, vol)); if (master) master.gain.value = volume; }
    },
    get enabled() { return enabled; },
    get volume() { return volume; }
  };
})(globalThis.TD = globalThis.TD || {});

</script>
<script>/* app.js */
/* Trilha Dev — interface. Depende de: TD.courses (conteúdo), TD.store, TD.runners, TD.local. */
(function (TD) {
  'use strict';
  const COURSES = TD.courses || [];
  const byId = Object.fromEntries(COURSES.map((c) => [c.id, c]));
  const XP = { quiz: 5, code: 10, clean: 5, lesson: 10, review: 5, reviewItem: 3, reviewDone: 5, checkpoint: 20 };
  const RANKS = [
    [0, 'Novato'], [150, 'Script Kiddie'], [400, 'Codificador de Rua'], [800, 'Hacker de Aluguel'],
    [1400, 'Engenheiro de Campo'], [2200, 'Arquiteto de Sistemas'], [3200, 'Fantasma da Rede'], [4500, 'Lenda Viva']
  ];
  const app = document.getElementById('app');
  const now = () => Date.now();
  const S = { caps: {}, store: null, mode: 'device', lesson: null, editor: null, view: { name: 'home' }, booted: false };

  /* ---------- helpers ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
  const fmtDate = (t) => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function md(src) {
    const out = [];
    String(src).split(/(?:```|~~~)[a-z]*\n?/).forEach((part, i) => {
      if (i % 2 === 1) { out.push(`<pre><code>${esc(part.replace(/\n$/, ''))}</code></pre>`); return; }
      part.split(/\n{2,}/).forEach((block) => {
        const b = block.trim(); if (!b) return;
        const lines = b.split('\n');
        if (lines.every((l) => /^\s*-\s+/.test(l))) out.push('<ul>' + lines.map((l) => `<li>${inline(l.replace(/^\s*-\s+/, ''))}</li>`).join('') + '</ul>');
        else if (lines.every((l) => /^\s*\d+\.\s+/.test(l))) out.push('<ol>' + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+\.\s+/, ''))}</li>`).join('') + '</ol>');
        else out.push(`<p>${lines.map(inline).join('<br>')}</p>`);
      });
    });
    return `<div class="md">${out.join('')}</div>`;
  }
  let toastTimer = null;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h(`<div class="toast" role="status">${esc(msg)}</div>`);
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4200);
  }
  function log(level, msg) { if (level === 'error') console.error('[trilha]', msg); }

  const ICON = {
    close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    play: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg>',
    check: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M5 12.5 10 17 19 7.5"/></svg>',
    lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    spark: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>',
    trophy: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg>'
  };

  /* ---------- estado derivado ---------- */
  const P = () => S.store.state.progress;
  const allLessons = (c) => c.units.flatMap((u) => u.lessons);
  const courseDone = (c) => allLessons(c).filter((l) => P().done[l.id]).length;
  const coursePct = (c) => Math.round((courseDone(c) / Math.max(1, allLessons(c).length)) * 100);
  // Mastery learning: o 1º lição de cada módulo exige o checkpoint do módulo anterior.
  const isUnlocked = (c, lesson) => {
    if (P().settings.unlockAll || P().done[lesson.id]) return true;
    const ls = allLessons(c); const i = ls.findIndex((l) => l.id === lesson.id);
    if (i === 0) return true;
    if (!P().done[ls[i - 1].id]) return false;
    const ui = c.units.findIndex((u) => u.lessons[0].id === lesson.id);
    return ui <= 0 || TD.ped.unitMastered(P(), c, ui - 1) || !TD.ped.checkpointLesson(c, ui - 1, 'x');
  };
  const unitDone = (c, ui) => c.units[ui].lessons.every((l) => P().done[l.id]);
  const checkpointOpen = (c, ui) => P().settings.unlockAll || unitDone(c, ui);
  // próxima coisa a fazer na trilha: lição pendente ou checkpoint pendente
  function nextTarget(c) {
    for (let ui = 0; ui < c.units.length; ui++) {
      const pending = c.units[ui].lessons.find((l) => !P().done[l.id]);
      if (pending) return isUnlocked(c, pending) ? pending : null;
      if (!TD.ped.unitMastered(P(), c, ui) && TD.ped.checkpointLesson(c, ui, 'x')) return { id: '@cp' + ui, title: 'Checkpoint: ' + c.units[ui].title, checkpoint: ui };
    }
    return null;
  }
  const nextLesson = (c) => nextTarget(c);
  const liveStreak = () => (P().lastDay === dayKey() || P().lastDay === yesterday() ? P().streak : 0);
  const todayXP = () => (P().days[dayKey()] || {}).xp || 0;
  const goal = () => P().settings.goal || 30;
  function rankOf(xp) {
    let i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
    const cur = RANKS[i], nxt = RANKS[i + 1];
    return { level: i + 1, name: cur[1], next: nxt ? nxt[0] : null, base: cur[0], pct: nxt ? Math.round(((xp - cur[0]) / (nxt[0] - cur[0])) * 100) : 100 };
  }
  const tutorAvailable = () => !!(S.caps.sample);
  const sfx = (n, a) => TD.sfx && TD.sfx.play(n, a);

  /* ---------- salvamento ---------- */
  function renderSaveState() {
    const el = document.getElementById('save-state'); if (!el) return;
    const n = S.store.pendingN;

    el.className = 'save-state' + (n ? ' busy' : S.store.lastError ? ' err' : '');

  }
  function saveProgress() { return S.store.saveProgress().catch(() => {}); }

  /* ---------- roteamento ---------- */
  function route() {

    else S.view = { name: 'home' };

  }

  /* ---------- rail ---------- */
  function railHTML() {

        </div>
        <span class="hud" style="padding:0 8px">Trilhas</span>
        <div class="rail-nav">
          ${COURSES.map((c) => `
            <a class="rail-item ${v.id === c.id ? 'active' : ''}" data-course="${c.id}" href="#${c.id}">
              <span class="chip">${esc(c.badge)}</span>
              <span class="mini"><span>${esc(c.name)}</span><span class="meter"><i style="width:${coursePct(c)}%"></i></span></span>
              <span class="pct">${coursePct(c)}%</span>

        </div>
        <span class="hud" style="padding:0 8px">Sistema</span>
        <div class="rail-nav">

          <a class="rail-item ${v.name === 'config' ? 'active' : ''}" href="#config"><span class="chip sys">⚙</span><span class="mini"><span>Configurações</span></span></a>
        </div>
        <div class="stats">
          <div class="stat streak"><b>${st}</b><small>${st === 1 ? 'dia seguido' : 'dias seguidos'}</small></div>
          <div class="stat"><b>${Object.keys(p.done).length}</b><small>lições feitas</small></div>
          <div class="stat goal"><div class="row"><small>Meta do dia</small><small style="font-family:var(--font-mono)">${todayXP()}/${goal()} XP</small></div><div class="meter" style="--accent:var(--cyan)"><i style="width:${gp}%"></i></div></div>
        </div>

      </aside>
      <nav class="tabbar" aria-label="Navegação">

  }

  /* ---------- home ---------- */
  function backupNudge() {
    if (S.mode === 'db') return '';

    return `<div class="node-wrap cp ${open ? '' : 'locked'}"><span class="hex-ring ${open && !passed ? 'current' : ''}"><button class="node diamond ${passed ? 'done' : open ? '' : 'locked'}" ${open ? `data-start="${c.id}:@cp${ui}"` : 'disabled'} aria-label="Checkpoint do módulo ${ui + 1}">${passed ? ICON.check : open ? '◆' : ICON.lock}</button></span><div class="node-label"><strong>Checkpoint do módulo</strong><small>${status}</small></div></div>`;
  }
  const OFFS = [0, 60, 90, 60, 0, -60, -90, -60];
  function courseHTML(c) {
    const nl = nextLesson(c);

          <span class="chip lg">${esc(c.badge)}</span>
          <div class="grow"><span class="hud" style="color:var(--accent)">${esc(c.tagline)}</span><h1 class="glitch">${esc(c.name)}</h1><p>${esc(c.desc)}</p></div>

                <div class="path">

          </aside>

  /* ---------- dados e backups ---------- */
  function dataHTML() {
    const where = {

    const last = P().settings.lastExport;
    return `
      <div class="page">
        <header class="page-head"><span class="hud">Sistema · persistência</span><h1 class="glitch">Dados e backups</h1>
          <p>Seu progresso é um registro simples (lições feitas, XP, sequência e o código que você escreveu). Ele pode ser exportado, guardado e restaurado em qualquer versão do app: Claude, navegador ou programa de PC.</p></header>
        <div class="grid2">
          <div class="card cut">
            <span class="hud">Onde está salvo</span>
            <h3>${esc({ db: 'Conta Claude', native: 'Programa de PC', device: 'Navegador', local: 'Navegador' }[S.mode])}</h3>
            <p>${esc(where)}</p>
            ${window.tdNative && window.tdNative.openDataFolder ? '<div class="row"><button class="btn sm" data-act="open-folder">Abrir pasta de dados</button></div>' : ''}
          </div>
          <div class="card cut">
            <span class="hud">Backup em arquivo</span>
            <h3>Exportar e restaurar</h3>
            <p>${last ? 'Último backup exportado: ' + esc(fmtDate(last)) : 'Nenhum backup exportado ainda.'}</p>
            <div class="row">
              <button class="btn primary" data-act="export">Exportar backup (JSON)</button>
              <button class="btn" data-act="copy-json">Copiar JSON</button>
              <label class="btn">Restaurar de arquivo<input type="file" id="imp-file" accept=".json,application/json" class="sr"></label>
            </div>
            <div id="restore-box"></div>
          </div>
          <div class="card cut" style="grid-column:1/-1">
            <span class="hud">Backups automáticos</span>
            <h3>Cópias semanais</h3>
            <p>Toda semana o app guarda uma cópia do progresso dentro do próprio armazenamento (as 4 mais recentes).</p>
            <div class="list" id="auto-list"><div class="list-item"><span class="grow"><small>Carregando...</small></span></div></div>
          </div>
        </div>
      </div>`;
  }
  async function fillAutoBackups() {
    const box = document.getElementById('auto-list'); if (!box) return;
    try {
      const list = await S.store.listBackups();
      box.innerHTML = list.length ? list.map((b) => `<div class="list-item"><span class="grow">Semana ${esc(b.id)}<small>${esc(fmtDate(b.at))} · ${(b.size / 1024).toFixed(1)} KB</small></span><button class="btn sm" data-restore-auto="${esc(b.id)}">Restaurar</button></div>`).join('')
        : '<div class="list-item"><span class="grow"><small>Nenhuma cópia ainda. A primeira é feita quando você tiver lições completas.</small></span></div>';
      box._list = list;
    } catch (e) { box.innerHTML = '<div class="list-item"><span class="grow"><small>Não consegui ler as cópias agora.</small></span></div>'; }
  }
  function exportJSON() { return JSON.stringify(S.store.exportData(now(), TD.contentVersion)); }
  async function doExport() {
    const name = 'trilha-dev-backup-' + dayKey() + '.json';
    const data = exportJSON();
    if (S.caps.downloads) {
      try { await S.caps.downloads.save({ filename: name, data }); P().settings.lastExport = now(); await saveProgress(); toast('Backup salvo: ' + name); render(); return; }
      catch (e) { if (e && e.code === 'dismissed') return; }
    }
    try { await navigator.clipboard.writeText(data); P().settings.lastExport = now(); await saveProgress(); toast('Download indisponível aqui: o JSON foi copiado. Cole num arquivo .json pra guardar.'); render(); }
    catch (e) { toast('Não foi possível exportar daqui.'); }
  }
  function askRestore(obj, label) {
    const box = document.getElementById('restore-box'); if (!box) return;
    const err = TD.store.validateBackup(obj);
    if (err) { box.innerHTML = `<p style="color:var(--bad)">${esc(err)}</p>`; return; }
    const n = Object.keys(obj.data.progress.done || {}).length;
    box.innerHTML = `<div class="banner warn"><div class="grow"><strong>Restaurar ${esc(label)}?</strong><span style="color:var(--muted);font-size:14px">${n} lições completas, ${obj.data.progress.xp} XP. O progresso atual será substituído.</span></div><button class="btn sm" data-act="restore-no">Cancelar</button><button class="btn sm danger" data-act="restore-yes">Restaurar</button></div>`;
    box._obj = obj;
    box.scrollIntoView({ block: 'nearest' });
  }
  async function doRestore() {
    const box = document.getElementById('restore-box'); const obj = box && box._obj; if (!obj) return;
    try { await S.store.importData(obj, now()); await S.store.flush(); toast('Backup restaurado e verificado.'); render(); }
    catch (e) { toast('Falha ao restaurar: ' + e.message); }
  }

  /* ---------- configurações ---------- */
  function configHTML() {
    const st = P().settings; const ai = TD.local ? TD.local.aiSettings() : {};
    const inClaude = !!window.claude;
    return `
      <div class="page">

          <div class="card cut">
            <span class="hud">Ritmo</span><h3>Meta diária</h3>

              <select id="cfg-goal">${[20, 30, 50, 80].map((g) => `<option value="${g}" ${goal() === g ? 'selected' : ''}>${g} XP · ${{ 20: 'leve', 30: 'normal', 50: 'puxado', 80: 'insano' }[g]}</option>`).join('')}</select></div>

            <div class="field"><label for="cfg-key">API key</label><input id="cfg-key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(ai.key || '')}"></div>
            <div class="row"><button class="btn primary" data-act="save-key">Salvar e testar</button>${ai.key ? '<button class="btn ghost" data-act="clear-key">Remover chave</button>' : ''}</div>`}
          </div>
          <div class="card cut">
            <span class="hud" style="color:var(--magenta)">Zona de risco</span><h3>Zerar progresso</h3>
            <p>Apaga XP, sequência e lições feitas. Faça um backup antes.</p>
            <div class="row"><button class="btn danger" data-act="reset-ask">Zerar tudo</button></div>
            <div id="reset-box"></div>
          </div>
          <div class="card cut">
            <span class="hud">Versão</span><h3>Trilha Dev</h3>
            <p>Conteúdo ${esc(TD.contentVersion || '')} · ${COURSES.reduce((a, c) => a + allLessons(c).length, 0)} lições · ${COURSES.reduce((a, c) => a + allLessons(c).reduce((b, l) => b + l.steps.filter((s) => s.t === 'code').length, 0), 0)} exercícios de código.</p>
          </div>
        </div>
      </div>`;
  }

  /* ---------- player de lição (Método Trilha: ver pedagogy.js e PEDAGOGIA.md) ---------- */
  const isAsk = (s) => s && (s.t === 'quiz' || s.t === 'predict');
  function findLesson(cid, lid) { const c = byId[cid]; const l = c && allLessons(c).find((x) => x.id === lid); return l ? { c, l } : null; }
  function newLessonState(c, lesson, kind) {
    return { c, lesson, kind, i: 0, earned: 0, correct: 0, graded: 0, results: {}, review: kind === 'lesson' && !!P().done[lesson.id], phase: 'step', d: {} };
  }
  function startLesson(cid, lid) {
    if (lid === '@review') return startReview();
    const c = byId[cid]; if (!c) return;
    if (lid && lid.startsWith('@cp')) {
      const ui = Number(lid.slice(3));
      const cp = TD.ped.checkpointLesson(c, ui, String(now()));
      if (!cp) return;
      cp.steps = cp.steps.map((s) => Object.assign(s, { _c: c }));
      S.lesson = newLessonState(c, cp, 'checkpoint');
      renderLesson(); return;
    }
    const f = findLesson(cid, lid); if (!f) return;
    P().last = cid; saveProgress();
    S.lesson = newLessonState(f.c, f.l, 'lesson');
    renderLesson();
  }
  function startReview() {
    const items = TD.ped.dueItems(P(), COURSES, now());
    if (!items.length) { toast('Nada pra revisar agora.'); return; }
    const steps = items.map((it) => Object.assign({}, it.step, { _c: it.c, _from: it.key, _fromTitle: it.l.title, _blocks: it.step.t === 'code' }));
    const lesson = { id: '@review', title: 'Revisão do dia', steps };
    S.lesson = newLessonState(items[0].c, lesson, 'review');
    renderLesson();
  }
  function closeLesson(rerender = true) { S.lesson = null; S.editor = null; if (rerender) render(); }
  const courseOf = (ls, step) => (step && step._c) || ls.c;
  function stepRunner(c, step) { return step.runner || c.runner; }
  function stepsBar(ls) { return `<div class="steps-bar" aria-hidden="true">${ls.lesson.steps.map((_, i) => `<i class="${i < ls.i || ls.phase === 'complete' ? 'on' : i === ls.i ? 'now' : ''}"></i>`).join('')}</div>`; }
  function sourceLesson(step, ls) {
    if (step._from) { const f = TD.ped && step._c ? allLessons(step._c).find((l) => l.id === step._from.split('#')[0]) : null; return f || null; }
    return ls.lesson;
  }
  function theoryHTML(step, ls) {
    const src = sourceLesson(step, ls); if (!src) return '';
    const learns = src.steps.filter((s) => s.t === 'learn'); if (!learns.length) return '';
    return `<details class="theory"${ls.d.theoryOpen ? ' open' : ''}><summary>Revisar a teoria${step._fromTitle ? ': ' + esc(step._fromTitle) : ' desta lição'}</summary>${learns.map((s) => `<h4>${esc(s.title)}</h4>${md(s.body)}`).join('')}</details>`;
  }

  function renderLesson() {
    const ls = S.lesson; app.className = 'app in-lesson';
    const step = ls.lesson.steps[ls.i];
    const c = courseOf(ls, step);
    const label = ls.kind === 'review' ? 'Revisão do dia' : ls.kind === 'checkpoint' ? ls.lesson.title : ls.lesson.title;
    const top = `<div class="lesson-top"><button class="icon-btn" data-act="quit" aria-label="Sair">${ICON.close}</button><span class="title">${esc(label)}</span>${stepsBar(ls)}<span class="xp-chip">+${ls.earned} XP</span></div>`;
    let body = '', foot = '';
    if (ls.phase === 'complete') {
      body = completeHTML(ls);
      foot = `<div class="lesson-foot"><div class="msg"></div><button class="btn" data-act="back">${ls.kind === 'review' ? 'Voltar ao início' : 'Voltar ao mapa'}</button>${ls.nextStart ? `<button class="btn primary" data-start="${ls.nextStart}">${ls.nextLabel || 'Próxima lição'} ${ICON.play}</button>` : ''}</div>`;
    } else if (step.t === 'learn') {
      const chunks = TD.ped.chunkBody(step.body);
      const shown = Math.min(ls.d.shown || 1, chunks.length);
      const more = shown < chunks.length;
      body = `<div class="reading"><span class="hud" style="color:var(--accent)">Briefing${chunks.length > 1 ? ` · parte ${shown}/${chunks.length}` : ''}</span><h2>${esc(step.title)}</h2>${chunks.slice(0, shown).map((ch, k) => `<div class="card-chunk${k === shown - 1 && k > 0 ? ' fresh' : ''}" id="chunk-${k}">${md(ch)}</div>`).join('')}</div>`;
      foot = `<div class="lesson-foot"><div class="msg"><span>${more ? 'Leia este pedaço e continue quando entender.' : 'Fechou a ideia? Bora praticar.'}</span></div><button class="btn primary" data-act="${more ? 'reveal' : 'next'}">${more ? 'Continuar' : 'Entendi'} <kbd>Enter</kbd></button></div>`;
    } else if (isAsk(step)) { body = quizHTML(step, ls); foot = quizFoot(step, ls); }
    else { body = codeHTML(step, ls); foot = codeFoot(step, ls); }
    app.innerHTML = `<main class="main lesson" data-course="${c.id}">${top}<div class="lesson-body">${body}</div>${foot}</main>`;
    if (step && step.t === 'code' && ls.phase !== 'complete') mountEditor(step, ls);
    else { const pb = app.querySelector('.lesson-foot .btn.primary:not(:disabled)'); if (pb) pb.focus({ preventScroll: true }); }
    const fresh = app.querySelector('.card-chunk.fresh'); if (fresh) fresh.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function originTag(step) { return step._fromTitle ? `<span class="origin">de: ${esc(step._c ? step._c.name + ' · ' : '')}${esc(step._fromTitle)}</span>` : ''; }
  function quizHTML(step, ls) {
    const d = ls.d;
    const kind = step.t === 'predict' ? 'Preveja o resultado' : 'Quiz';
    return `<div class="reading"><span class="hud" style="color:var(--accent)">${kind}</span>${originTag(step)}<div class="quiz-q">${inline(step.q)}</div>
      ${step.code ? `<div class="md"><pre><code>${esc(step.code)}</code></pre></div>` : ''}
      <div class="opts">${step.opts.map((o, i) => {
        let cls = ''; if (d.checked) cls = i === step.a ? 'right' : i === d.sel ? 'wrong' : ''; else if (d.sel === i) cls = 'sel';
        return `<button class="opt ${cls}" data-opt="${i}" ${d.checked ? 'disabled' : ''}><span class="k">${i + 1}</span><code>${esc(o)}</code></button>`;
      }).join('')}</div></div>`;
  }
  function quizFoot(step, ls) {
    const d = ls.d;
    if (!d.checked) return `<div class="lesson-foot"><div class="msg"><span>${step.t === 'predict' ? 'Leia o código e pense no que ele faz antes de escolher.' : 'Escolha uma opção'} (teclas 1 a ${step.opts.length})</span></div><button class="btn primary" data-act="check" ${d.sel == null ? 'disabled' : ''}>Verificar <kbd>Enter</kbd></button></div>`;
    const ok = d.sel === step.a;
    return `<div class="lesson-foot ${ok ? 'good' : 'badf'}"><div class="msg"><strong>${ok ? 'Acesso liberado' : 'Resposta errada'}</strong>${md(step.why)}${ok ? '' : '<span>Essa pergunta volta na sua revisão, pra fixar.</span>'}</div><button class="btn primary" data-act="next">Continuar <kbd>Enter</kbd></button></div>`;
  }

  function fileName(r) { return { js: 'main.js', ts: 'main.ts', sql: 'query.sql', web: 'index.html', dom: 'index.html' }[r] || 'main.txt'; }
  function unitIndexOf(c, lessonId) { return c.units.findIndex((u) => u.lessons.some((l) => l.id === lessonId)); }
  function defaultMode(step, ls) {
    if (step._blocks) return TD.ped.parsonsBlocks(step, 'x') ? 'blocks' : 'write';
    if (ls.kind === 'lesson' && unitIndexOf(ls.c, ls.lesson.id) === 0 && !ls.review && TD.ped.parsonsBlocks(step, 'x')) return 'blocks';
    return 'write';
  }
  function ensurePz(step, ls) {
    const d = ls.d;
    if (!d.pz) { const blocks = TD.ped.parsonsBlocks(step, (step._from || ls.lesson.id) + '#' + ls.i); d.pz = blocks ? { pool: blocks, answer: [] } : null; }
    return d.pz;
  }
  const pzCode = (d) => d.pz ? d.pz.answer.map((b) => b.text).join('\n') : '';

  function codeHTML(step, ls) {
    const c = courseOf(ls, step), d = ls.d, r = stepRunner(c, step);
    if (!d.mode) d.mode = defaultMode(step, ls);
    const canBlocks = !!TD.ped.parsonsBlocks(step, 'x');
    const saved = ls.kind === 'lesson' ? ((S.store.state.code[ls.lesson.id] || {}).steps || {}) : {};
    return `
      <div class="workspace">
        <section class="brief">
          <span class="hud" style="color:var(--accent)">${d.mode === 'blocks' ? 'Exercício · modo guiado' : 'Exercício'}</span>${originTag(step)}
          <h2>${esc(step.title)}</h2>
          ${md(step.task)}
          ${d.mode === 'blocks' ? '<div class="hint"><strong>Modo guiado:</strong> clique nos blocos na ordem certa pra montar o código. Depois rode. Quando se sentir seguro, troque pra <strong>Escrever</strong>.</div>' : ''}
          ${r === 'sql' && c.dbNotes && c.dbNotes[step.db || 'shop'] ? `<div class="hint">${md(c.dbNotes[step.db || 'shop'])}</div>` : ''}
          <div><span class="hud" style="display:block;margin-bottom:8px">Testes</span><ul class="tests" id="tests">${testList(step, c, d)}</ul></div>
          ${theoryHTML(step, ls)}
          ${d.showHint ? `<div class="hint"><strong>Dica:</strong> ${inline(step.hint)}</div>` : `<button class="btn sm" data-act="hint">Mostrar dica</button>`}
          ${tutorAvailable() && ls.tutorOff !== true ? `
          <div class="tutor cut">
            <div class="tutor-head">${ICON.spark} Tutor de IA</div>
            <label for="tutor-q" style="font-size:13px;color:var(--muted)">Pergunte sobre o exercício, ou deixe em branco pra ele analisar seu código.</label>
            <textarea id="tutor-q" placeholder="Ex: por que meu filter retorna vazio?">${esc(d.tutorQ || '')}</textarea>
            <button class="btn sm" data-act="tutor" ${d.tutorBusy ? 'disabled' : ''}>${d.tutorBusy ? 'Processando...' : 'Pedir ajuda ao tutor'}</button>
            ${d.tutorA ? `<div class="tutor-answer ${d.tutorWait ? 'wait' : ''}" id="tutor-a">${d.tutorWait ? 'conectando ao tutor...' : md(d.tutorA)}</div>` : ''}
          </div>` : (!window.claude ? '<p style="font-size:13px;color:var(--dim)">Tutor de IA desligado. Configure sua chave em Configurações pra usar.</p>' : '')}
        </section>
        <section class="editor-col">
          <div class="ed-bar">
            <span class="file">${fileName(r)}</span>
            ${canBlocks ? `<span class="seg" role="group" aria-label="Modo"><button class="${d.mode === 'blocks' ? 'on' : ''}" data-act="mode-blocks">Blocos</button><button class="${d.mode === 'write' ? 'on' : ''}" data-act="mode-write">Escrever</button></span>` : ''}
            ${d.mode === 'write' && saved[ls.i] != null ? '<button class="btn ghost sm" data-act="load-saved">Meu código salvo</button>' : ''}
            <button class="btn ghost sm" data-act="reset">Recomeçar</button>
            ${d.fails >= 2 || d.passed ? `<button class="btn ghost sm" data-act="solution">${d.showSolution ? 'Esconder' : 'Ver'} solução</button>` : ''}
            <button class="btn primary sm" data-act="run" ${d.running ? 'disabled' : ''}>${ICON.play} ${d.running ? 'Rodando...' : 'Rodar'} <kbd>Ctrl ↵</kbd></button>
          </div>
          <div class="ed-host" id="ed-host"></div>
          <div class="out">
            <div class="out-tabs" id="out-tabs">${outTabs(r, d)}</div>
            <div class="out-body" id="out-body">${outBody(r, d)}</div>
          </div>
        </section>
      </div>`;
  }
  function testList(step, c, d) {
    let items;
    if (d.results) items = d.results;
    else {
      const r = stepRunner(c, step);
      items = [];
      if (r === 'ts') { items.push({ name: 'Compila sem type errors' }); if (step.typeTests) items.push({ name: step.typeTestsName || 'Os tipos batem com o esperado' }); }
      if (r === 'sql') items.push({ name: step.check ? 'O banco ficou com os dados esperados' : 'Resultado igual ao esperado' });
      for (const t of step.tests || []) items.push({ name: t[0] });
      for (const t of step.requires || []) items.push({ name: t[0] });
    }
    return items.map((x) => `<li class="${x.pass === true ? 'pass' : x.pass === false ? 'fail' : ''}"><span class="dot">${x.pass === true ? '✓' : x.pass === false ? '✕' : ''}</span><span>${inline(x.name)}${x.err ? `<span class="err">${esc(x.err)}</span>` : ''}</span></li>`).join('');
  }
  function outTabs(r, d) {
    const tab = d.tab || (r === 'sql' ? 'result' : r === 'web' || r === 'dom' ? 'preview' : 'console');
    const b = (id, label) => `<button class="${tab === id ? 'on' : ''}" data-tab="${id}">${label}</button>`;
    let tabs;
    if (r === 'sql') tabs = b('result', 'Resultado') + b('expected', 'Esperado');
    else if (r === 'web') tabs = b('preview', 'Preview') + (d.res && d.res.output && d.res.output.length ? b('console', 'Console') : '');
    else if (r === 'dom') tabs = b('preview', 'Preview') + b('console', 'Console');
    else tabs = b('console', 'Console');
    return tabs + `<span class="status">${esc(d.statusText || '')}</span>`;
  }
  function tableHTML(t, caption) {
    if (!t) return '<pre class="console"><span class="dim">Nenhuma row.</span></pre>';
    return `<table class="rtable">${caption ? `<caption>${esc(caption)}</caption>` : ''}<thead><tr>${t.columns.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.values.slice(0, 200).map((row) => `<tr>${row.map((v) => `<td>${v === null ? 'NULL' : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  function explainHTML(r, res) {
    if (!res) return '';
    const msg = [res.error, ...(res.typeErrors || [])].filter(Boolean).join('\n');
    const tip = TD.ped.explainError(r, msg);
    return tip ? `<div class="explain"><strong>O que esse erro quer dizer:</strong> ${inline(tip)}</div>` : '';
  }
  function consoleHTML(res, empty, r) {
    if (!res) return `<pre class="console"><span class="dim">${empty}</span></pre>`;
    const lines = [];
    if (res.typeErrors && res.typeErrors.length) lines.push(...res.typeErrors.map((e) => `<span class="err">${esc(e)}</span>`));
    if (res.output && res.output.length) lines.push(...res.output.map((x) => `<span class="prompt">›</span> ${esc(x)}`));
    if (res.error) lines.push(`<span class="err">${esc(res.error)}</span>`);
    if (!lines.length) lines.push('<span class="dim">(nada no console)</span>');
    return `<pre class="console">${lines.join('\n')}</pre>${explainHTML(r, res)}`;
  }
  function outBody(r, d) {
    const tab = d.tab || (r === 'sql' ? 'result' : r === 'web' || r === 'dom' ? 'preview' : 'console');
    if (r === 'web' || r === 'dom') {
      return `<iframe class="preview-frame ${tab === 'preview' ? '' : 'hidden'}" id="preview" title="Preview"></iframe><div id="dom-console" class="${tab === 'console' ? '' : 'hidden'}">${consoleHTML(d.res, 'console.log aparece aqui depois de rodar.', r)}</div>`;
    }
    const res = d.res;
    if (r === 'sql') {
      if (tab === 'expected') return res ? tableHTML(res.expectedTable, 'Resultado esperado') : '<pre class="console"><span class="dim">Rode a query pra comparar com o esperado.</span></pre>';
      if (!res) return '<pre class="console"><span class="dim">Rode a query pra ver o resultado aqui.</span></pre>';
      if (res.error) return `<pre class="console"><span class="err">${esc(res.error)}</span></pre>${explainHTML(r, res)}`;
      return (res.output ? `<pre class="console"><span class="dim">${esc(res.output.join('\n'))}</span></pre>` : '') + (res.table ? tableHTML(res.table) : '');
    }
    return consoleHTML(res, 'A saída do console.log aparece aqui.', r);
  }
  function codeFoot(step, ls) {
    const d = ls.d;
    if (d.passed) {
