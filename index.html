/* Trilha Dev — cyberpunk HUD. Single dark theme by choice: neon yellow primary, cyan for system/info,
   magenta for errors/alerts. Layout: left rail (status + trilhas), main canvas (home, mapa, lição, dados, config). */
:root {
  --bg: #06070b;
  --panel: #0d1017;
  --panel-2: #131824;
  --panel-3: #1a2131;
  --line: #242c3e;
  --line-2: #33405a;
  --ink: #eaf0fa;
  --muted: #8e9ab2;
  --dim: #5d6880;
  --yellow: #f7e600;
  --cyan: #00e5ff;
  --magenta: #ff2a6d;
  --ok: #2dffb0;
  --bad: #ff2a6d;
  --c-js: #f7e600;
  --c-ts: #3db4ff;
  --c-sql: #2dffb0;
  --c-web: #ff4f8b;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --cut: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(0, 229, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, .035) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
}
body::after { /* scanlines */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
code, pre, kbd { font-family: var(--font-mono); }
a { color: var(--cyan); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

[data-course="js"] { --accent: var(--c-js); --on-accent: #0a0a00; }
[data-course="ts"] { --accent: var(--c-ts); --on-accent: #001222; }
[data-course="sql"] { --accent: var(--c-sql); --on-accent: #00140d; }
[data-course="web"] { --accent: var(--c-web); --on-accent: #1a0009; }

.cut { clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.hud { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.hud::before { content: "// "; opacity: .6; }
.glitch { position: relative; text-shadow: 2px 0 rgba(255, 42, 109, .75), -2px 0 rgba(0, 229, 255, .75); }

.app { display: grid; grid-template-columns: 264px 1fr; height: 100%; position: relative; }
.app.in-lesson { grid-template-columns: 1fr; }
.app.in-lesson .rail { display: none; }

/* ---------- Rail ---------- */
.rail { background: rgba(9, 11, 17, .96); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding: 18px 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 34px; height: 34px; display: block; flex: none; }
.brand-mark svg { display: block; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.brand-name b { color: #ff3ea5; }
.rank { border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; display: grid; gap: 8px; }
.rank .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rank .who strong { font-family: var(--font-display); font-size: 16px; color: var(--yellow); text-transform: uppercase; letter-spacing: .03em; }
.rank .who span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.meter { height: 6px; background: var(--panel-3); position: relative; overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent, var(--yellow)); box-shadow: 0 0 10px var(--accent, var(--yellow)); transition: width .4s ease; }
.rank small { color: var(--dim); font-family: var(--font-mono); font-size: 11px; }
.rail-nav { display: flex; flex-direction: column; gap: 4px; }
.rail-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; width: 100%; color: var(--ink); text-decoration: none; }
.rail-item:hover { background: var(--panel-2); border-color: var(--line); }
.rail-item.active { background: var(--panel-2); border-color: var(--accent, var(--cyan)); box-shadow: inset 3px 0 0 var(--accent, var(--cyan)); }
.rail-item .mini { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rail-item .mini span { font-weight: 500; }
.rail-item .pct { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chip { flex: none; width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: 11px; background: var(--accent, var(--panel-3)); color: var(--on-accent, var(--ink)); clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); }
.chip.lg { width: 56px; height: 56px; font-size: 15px; }
.chip.sys { background: var(--panel-3); color: var(--cyan); border: 1px solid var(--line-2); }
.stats { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat small { color: var(--muted); font-size: 11.5px; }
.stat.streak b { color: var(--magenta); }
.stat.goal { grid-column: span 2; }
.stat.goal .row { display: flex; justify-content: space-between; align-items: baseline; }
.save-state { font-family: var(--font-mono); font-size: 11px; color: var(--dim); padding: 0 4px; display: flex; align-items: center; gap: 6px; }
.save-state::before { content: ""; width: 7px; height: 7px; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.save-state.busy::before { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.save-state.err::before { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

/* ---------- Main ---------- */
.main { overflow-y: auto; min-width: 0; }
.page { max-width: 1160px; margin: 0 auto; padding: 34px 40px 72px; display: flex; flex-direction: column; gap: 26px; }
.page-head { display: flex; flex-direction: column; gap: 8px; }
.page-head h1 { font-size: 40px; font-weight: 700; text-transform: uppercase; }
.page-head p { color: var(--muted); margin: 0; max-width: 64ch; }
.banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent, var(--yellow)) 16%, var(--panel)), var(--panel) 60%); border: 1px solid var(--line); border-left: 3px solid var(--accent, var(--yellow)); }
.banner .grow { flex: 1; min-width: 0; }
.banner strong { font-size: 16px; display: block; }
.banner.warn { --accent: var(--magenta); }

.course-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.course-card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 20px; background: var(--panel); border: 1px solid var(--line); text-align: left; cursor: pointer; color: var(--ink); transition: transform .15s ease, background .15s ease; }
.course-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.course-card::after { content: attr(data-idx); position: absolute; right: 22px; top: 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.course-card:hover { transform: translateY(-2px); background: var(--panel-2); }
.course-card .top { display: flex; align-items: center; gap: 14px; }
.course-card h2 { font-size: 24px; text-transform: uppercase; }
.course-card .tag { color: var(--accent); font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; }
.course-card p { margin: 0; color: var(--ink); opacity: .82; }
.course-card .meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-card .topics { display: flex; flex-wrap: wrap; gap: 6px; }
.course-card .topics span { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--line-2); color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); padding: 10px 18px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; background: var(--panel-2); color: var(--ink); white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.primary { background: var(--accent, var(--yellow)); color: var(--on-accent, #0a0a00); border-color: transparent; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); padding: 11px 22px; }
.btn.primary:hover { background: var(--cyan); color: #001014; }
.btn.danger { border-color: var(--magenta); color: var(--magenta); }
.btn.danger:hover { background: var(--magenta); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--cyan); border-color: var(--line-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
kbd { font-size: 10.5px; padding: 1px 5px; border: 1px solid currentColor; opacity: .7; letter-spacing: 0; text-transform: none; }

/* ---------- Course map ---------- */
.course-head { display: flex; align-items: center; gap: 18px; }
.course-head .grow { flex: 1; }
.course-head h1 { font-size: 38px; text-transform: uppercase; }
.course-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.course-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 32px; align-items: start; }
.units { display: flex; flex-direction: column; gap: 34px; }
.unit-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--accent); position: relative; }
.unit-banner small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.unit-banner h2 { font-size: 22px; text-transform: uppercase; }
.unit-banner .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-banner.done { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 0 4px; }
.node-wrap { display: flex; align-items: center; gap: 16px; width: 380px; }
.node { position: relative; flex: none; width: 70px; height: 76px; border: 0; cursor: pointer; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; background: var(--accent); color: var(--on-accent); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: transform .12s ease, filter .12s ease; }
.node:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.1); }
.node.done { background: var(--panel-3); color: var(--accent); }
.node.done::before { content: ""; position: absolute; inset: 3px; clip-path: inherit; border: 0; background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.node.locked { background: var(--panel-3); color: var(--dim); cursor: not-allowed; }
.hex-ring { position: relative; flex: none; display: grid; place-items: center; width: 70px; height: 76px; }
.hex-ring.current::before { content: ""; position: absolute; inset: -8px; background: var(--accent); opacity: .35; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: .4; } 50% { transform: scale(1.08); opacity: .1; } }
.node-label { display: flex; flex-direction: column; min-width: 0; }
.node-label strong { font-size: 15px; }
.node-label small { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }
.node-wrap.locked .node-label { opacity: .5; }
.side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-size: 22px; text-transform: uppercase; }
.card h3 { font-size: 18px; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .md { font-size: 14px; }

/* ---------- Lesson ---------- */
.lesson { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.lesson-top { display: flex; align-items: center; gap: 18px; padding: 12px 22px; background: rgba(9, 11, 17, .96); border-bottom: 1px solid var(--line); }
.lesson-top .title { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.steps-bar { flex: 1; display: flex; gap: 4px; }
.steps-bar i { flex: 1; height: 6px; background: var(--panel-3); transform: skewX(-30deg); }
.steps-bar i.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.steps-bar i.now { background: color-mix(in srgb, var(--accent) 40%, var(--panel-3)); }
.icon-btn { width: 36px; height: 36px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.icon-btn:hover { border-color: var(--magenta); color: var(--magenta); }
.xp-chip { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.lesson-body { overflow-y: auto; min-height: 0; }
.reading { max-width: 760px; margin: 0 auto; padding: 40px 32px 56px; display: flex; flex-direction: column; gap: 18px; }
.reading h2 { font-size: 32px; text-transform: uppercase; }
.md { display: flex; flex-direction: column; gap: 12px; max-width: 70ch; }
.md p { margin: 0; }
.md ul, .md ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.md li::marker { color: var(--accent, var(--cyan)); }
.md strong { color: var(--accent, var(--yellow)); font-weight: 600; }
.md code { background: color-mix(in srgb, var(--accent, var(--cyan)) 13%, transparent); color: var(--ink); padding: 1px 6px; font-size: .9em; }
.md pre { margin: 0; background: #080a10; color: #dfe7f5; border: 1px solid var(--line); border-left: 2px solid var(--accent, var(--cyan)); padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; }
.md pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.quiz-q { font-size: 22px; font-family: var(--font-display); font-weight: 600; line-height: 1.3; }
.quiz-q code { font-family: var(--font-mono); font-size: .8em; color: var(--accent); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; width: 26px; height: 26px; border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.opt code { font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.opt.sel .k { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.opt:disabled { cursor: default; }
.lesson-foot { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-top: 1px solid var(--line); background: rgba(9, 11, 17, .96); min-height: 74px; }
.lesson-foot .msg { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.lesson-foot .msg strong { font-family: var(--font-display); font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
.lesson-foot .msg span { color: var(--muted); font-size: 14px; }
.lesson-foot.good { border-top: 2px solid var(--ok); background: linear-gradient(90deg, color-mix(in srgb, var(--ok) 14%, var(--bg)), var(--bg)); }
.lesson-foot.good .msg strong { color: var(--ok); }
.lesson-foot.badf { border-top: 2px solid var(--bad); background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 14%, var(--bg)), var(--bg)); }
.lesson-foot.badf .msg strong { color: var(--bad); }
.lesson-foot .md { max-width: none; gap: 4px; font-size: 14px; }

.workspace { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); height: 100%; min-height: 0; }
.brief { border-right: 1px solid var(--line); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 18px; background: var(--panel); }
.brief h2 { font-size: 24px; text-transform: uppercase; }
.tests { display: flex; flex-direction: column; gap: 6px; list-style: none; padding: 0; margin: 0; }
.tests li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.tests li .dot { flex: none; width: 16px; height: 16px; border: 1px solid var(--line-2); margin-top: 2px; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
.tests li.pass { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.tests li.pass .dot { background: var(--ok); border-color: var(--ok); color: #00140d; }
.tests li.fail { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.tests li.fail .dot { background: var(--bad); border-color: var(--bad); color: #fff; }
.tests li code { font-size: 12.5px; background: color-mix(in srgb, var(--accent) 13%, transparent); padding: 0 4px; }
.tests li .err { display: block; color: var(--bad); font-family: var(--font-mono); font-size: 12px; }
.hint { border: 1px dashed var(--line-2); padding: 12px 14px; font-size: 14px; }
.tutor { border: 1px solid var(--line-2); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--cyan) 7%, var(--panel-2)), var(--panel-2)); }
.tutor-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--cyan); }
.tutor textarea, .field input, .field select { width: 100%; border: 1px solid var(--line-2); background: #080a10; color: var(--ink); padding: 8px 10px; font-size: 14px; }
.tutor textarea { resize: vertical; min-height: 54px; }
.tutor-answer { font-size: 14px; background: #080a10; border: 1px solid var(--line); border-left: 2px solid var(--cyan); padding: 10px 12px; }
.tutor-answer .md { gap: 8px; --accent: var(--cyan); }
.tutor-answer.wait { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

.editor-col { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(160px, 40%); min-height: 0; min-width: 0; background: #07090e; }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.ed-bar .file { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.ed-bar .file::before { content: ""; width: 8px; height: 8px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.ed-host { min-height: 0; overflow: hidden; position: relative; }
.ed-host .CodeMirror { height: 100%; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; background: #07090e; color: #dfe7f5; }
.ed-host textarea.plain { width: 100%; height: 100%; border: 0; resize: none; padding: 14px 16px; background: #07090e; color: #dfe7f5; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; tab-size: 2; }
.out { border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.out-tabs { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.out-tabs button { border: 1px solid transparent; background: none; padding: 3px 10px; cursor: pointer; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; }
.out-tabs button.on { border-color: var(--line-2); color: var(--accent); background: var(--panel-2); }
.out-tabs .status { margin-left: auto; color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
.out-body { flex: 1; overflow: auto; min-height: 0; position: relative; }
.console { margin: 0; padding: 12px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #dfe7f5; }
.console .err { color: var(--bad); }
.console .dim { color: var(--dim); }
.console .prompt { color: var(--accent); }
.preview-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
.hidden { display: none !important; }
.rtable { border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; margin: 10px 14px; font-variant-numeric: tabular-nums; }
.rtable th, .rtable td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
.rtable th { background: var(--panel-2); color: var(--accent); font-weight: 700; }
.rtable caption { caption-side: top; text-align: left; color: var(--muted); font-size: 11px; padding-bottom: 4px; letter-spacing: .1em; text-transform: uppercase; }

/* CodeMirror neon theme */
.cm-s-neon .CodeMirror-gutters { background: #07090e; border-right: 1px solid var(--line); }
.cm-s-neon .CodeMirror-linenumber { color: var(--dim); }
.cm-s-neon .CodeMirror-cursor { border-left: 2px solid var(--accent, var(--yellow)); }
.cm-s-neon .CodeMirror-selected, .cm-s-neon.CodeMirror-focused .CodeMirror-selected { background: rgba(0, 229, 255, .18); }
.cm-s-neon .CodeMirror-activeline-background { background: rgba(0, 229, 255, .05); }
.cm-s-neon .cm-keyword { color: #ff4f8b; }
.cm-s-neon .cm-def, .cm-s-neon .cm-variable-2 { color: #6fd8ff; }
.cm-s-neon .cm-variable { color: #e6edf8; }
.cm-s-neon .cm-string, .cm-s-neon .cm-string-2 { color: #9dff8a; }
.cm-s-neon .cm-number { color: #ffb347; }
.cm-s-neon .cm-comment { color: #5d6880; font-style: italic; }
.cm-s-neon .cm-tag { color: #ff4f8b; }
.cm-s-neon .cm-attribute, .cm-s-neon .cm-property { color: #f7e600; }
.cm-s-neon .cm-type, .cm-s-neon .cm-builtin { color: #2dffb0; }
.cm-s-neon .cm-atom, .cm-s-neon .cm-qualifier { color: #c49bff; }
.cm-s-neon .cm-operator { color: #00e5ff; }
.cm-s-neon .CodeMirror-matchingbracket { color: #fff !important; background: rgba(247, 230, 0, .25); }

/* complete */
.complete { max-width: 620px; margin: 0 auto; padding: 60px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
.complete h2 { font-size: 40px; text-transform: uppercase; }
.complete p { margin: 0; color: var(--muted); }
.trophy { width: 104px; height: 112px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.tile { border: 1px solid var(--line-2); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile small { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; color: var(--accent); }

/* data / settings */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item small { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; display: block; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--yellow); }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; background: var(--panel-2); border: 1px solid var(--cyan); color: var(--ink); padding: 12px 16px; font-size: 14px; max-width: 380px; box-shadow: 0 0 24px rgba(0, 229, 255, .2); }
.loading { display: grid; place-items: center; height: 100%; color: var(--cyan); font-family: var(--font-mono); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }

/* efeitos visuais de feedback */
@keyframes glitch-shake {
  0% { transform: translate(0); clip-path: none; }
  15% { transform: translate(-6px, 1px); filter: hue-rotate(40deg); }
  30% { transform: translate(5px, -1px); clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); }
  45% { transform: translate(-3px, 0); clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); }
  60% { transform: translate(3px, 1px); clip-path: none; filter: none; }
  100% { transform: translate(0); }
}
@keyframes neon-flash {
  0% { box-shadow: inset 0 0 0 0 transparent; }
  25% { box-shadow: inset 0 0 60px 0 color-mix(in srgb, var(--ok) 45%, transparent); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}
@keyframes boot-in {
  0% { opacity: 0; transform: scale(.85); filter: blur(6px) brightness(2); }
  40% { opacity: 1; transform: scale(1.06); filter: blur(0) brightness(1.6); }
  55% { transform: scale(.98) translateX(-4px); }
  70% { transform: scale(1.01) translateX(3px); }
  100% { transform: scale(1); filter: none; }
}
@keyframes scan-sweep { from { transform: translateY(-100%); } to { transform: translateY(100vh); } }
.lesson-foot.badf { animation: glitch-shake .35s steps(2, end) 1; }
.lesson-foot.good { animation: neon-flash .7s ease-out 1; }
.opt.wrong { animation: glitch-shake .35s steps(2, end) 1; }
.opt.right { animation: neon-flash .7s ease-out 1; }
.complete .trophy { animation: boot-in .7s ease-out 1; }
.complete h2 { animation: boot-in .8s .1s ease-out both; }
.tests li.pass { animation: neon-flash .6s ease-out 1; }
.lesson::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 120px; pointer-events: none; z-index: 40;
  background: linear-gradient(180deg, transparent, rgba(0, 229, 255, .05), transparent); animation: scan-sweep 7s linear infinite; }
.node:not(:disabled):hover { filter: brightness(1.15) drop-shadow(0 0 10px var(--accent)); }
.course-card:hover::before { width: 5px; }
.btn.primary:active { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) {
  .lesson-foot.badf, .lesson-foot.good, .opt.wrong, .opt.right, .complete .trophy, .complete h2, .tests li.pass { animation: none; }
  .lesson::after { display: none; }
  .hex-ring.current::before { animation: none; }
  .course-card, .meter > i, .node { transition: none; }
}
@media (max-width: 1020px) {
  .course-layout, .grid2 { grid-template-columns: 1fr; }
  .side { position: static; }
  .course-grid { grid-template-columns: 1fr; }
}
/* ---------- celular ---------- */
.tabbar, .topbar { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  .rail { display: none; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: rgba(9, 11, 17, .97); border-bottom: 1px solid var(--line); }
  .topbar .brand-name { margin-right: auto; font-size: 18px; }
  .tb-stat { font-family: var(--font-mono); font-size: 12px; color: var(--yellow); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); order: 3; background: rgba(9, 11, 17, .98); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 9px; color: var(--muted); text-decoration: none; font-size: 11px; font-family: var(--font-mono); letter-spacing: .04em; min-height: 52px; justify-content: center; }
  .tabbar a span { font-size: 18px; line-height: 1; }
  .tabbar a.active { color: var(--yellow); box-shadow: inset 0 2px 0 var(--yellow); }
  .topbar { order: 1; } .main { order: 2; }
  .app.in-lesson .tabbar, .app.in-lesson .topbar, body.in-lesson .tabbar, body.in-lesson .topbar { display: none; }
  .page { padding: 18px 14px 40px; }
  h1 { font-size: 28px; }
  .course-head { flex-wrap: wrap; gap: 12px; }
  .course-head h1 { font-size: 28px; }
  .banner { flex-wrap: wrap; }
  .banner .btn { width: 100%; justify-content: center; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .node-wrap { width: auto; max-width: 100%; transform: translateX(calc(var(--off, 0) * .35px)) !important; }
  .node-label { min-width: 0; }
  .node-label small { white-space: normal; }
  .btn { min-height: 44px; }
  /* lição */
  .lesson-top { padding: 10px 12px; gap: 10px; }
  .lesson-top .title { max-width: 38vw; font-size: 14px; }
  .reading { padding: 22px 16px 32px; }
  .reading h2 { font-size: 24px; }
  .lesson-foot { flex-wrap: wrap; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); gap: 8px; min-height: 0; }
  .lesson-foot .msg { flex-basis: 100%; }
  .lesson-foot .btn { flex: 1; justify-content: center; }
  .lesson-foot kbd, .btn kbd { display: none; }
  .opt { min-height: 48px; }
  .workspace { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; overflow-y: auto; }
  .lesson > .workspace { overflow-y: auto; }
  .brief { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; overflow: visible; }
  .brief h2 { font-size: 20px; }
  .ed-bar { flex-wrap: wrap; row-gap: 6px; }
  .ed-bar .file { flex-basis: 100%; }
  .ed-bar .btn { padding: 6px 10px; font-size: 12px; min-height: 36px; }
  .ed-bar [data-act="run"] { display: none; }
  .brief .tutor-note, .brief .dim-note { display: none; }
  .brief { gap: 12px; }
  .editor-col { grid-template-rows: auto auto auto; }
  .ed-host { height: auto; overflow: visible; }
  .ed-host .CodeMirror, .ed-host textarea.plain { height: 46vh; font-size: 15px; }
  .ed-host .parsons { grid-template-columns: 1fr; height: auto; }
  .pz-b { padding: 10px 12px; }
  .ed-host .pz-b code { white-space: pre-wrap; word-break: break-word; }
  .console { max-height: 40vh; overflow: auto; }
}

input[type="range"] { accent-color: var(--yellow); width: 100%; }

/* ---------- Método Trilha ---------- */
.card-chunk { display: flex; flex-direction: column; gap: 12px; padding-left: 14px; border-left: 2px solid var(--line-2); }
.card-chunk:last-child { border-left-color: var(--accent, var(--cyan)); }
.card-chunk.fresh { animation: chunk-in .35s ease-out both; }
@keyframes chunk-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Base do conteúdo: helpers para escrever lições de forma compacta.

(function (TD) {

    predict: (q, code, opts, a, why) => ({ t: 'predict', q, code, opts, a, why }),

console.log(2 + 3);      // 5   (soma)
console.log("2" + "3");  // 23  (junta os textos)
~~~

const name = "Rick";

- \`const\` cria a caixa
- \`name\` é a etiqueta
- \`=\` coloca o valor dentro

Depois disso, sempre que você escreve \`name\`, o JavaScript usa o valor guardado.`),

          learn('let: valores que mudam', `Uma \`const\` não pode receber outro valor depois. Quando o valor **vai mudar**, use \`let\`:

~~~
let score = 0;
score = 10;          // sem let de novo!
console.log(score);  // 10
~~~

Regra prática: comece sempre com \`const\`. Só troque pra \`let\` se precisar mudar. (Existe também o \`var\`, o jeito antigo: evite.)`),
          quiz('O que acontece ao rodar `const city = "Berlin"; city = "Munich";`?', ['city passa a valer "Munich"', 'Dá erro: não dá pra reatribuir uma const', 'city vira undefined', 'Cria uma segunda variável city'], 1,

- **number**: \`42\`, \`3.14\`
- **string**: \`"hello"\`
- **boolean**: \`true\` ou \`false\`
- **undefined**: variável que ainda não recebeu valor

O \`typeof\` diz o tipo:

~~~
typeof 42      // "number"
typeof "42"    // "string"

          learn('Fazendo contas', `Operadores matemáticos:

~~~
10 + 3    // 13
10 - 3    // 7
10 * 3    // 30  (multiplicação)

2 ** 3    // 8   (potência)

        lesson('js-strings', 'Methods de string',
          learn('Transformando texto', `Strings vêm com **methods**: comandos que você chama com um ponto depois do valor.

~~~
const s = "  Hello World  ";
s.length          // 15 (quantos caracteres)
s.trim()          // "Hello World" (tira espaços das pontas)
s.toUpperCase()   // "  HELLO WORLD  "

Os methods **não mudam** a string original: eles devolvem uma nova. Por isso a gente guarda o resultado numa variável.`),

            solution: 'const title = "  Learn JavaScript  ";\nconst clean = title.trim();\nconst upper = clean.toUpperCase();\nconsole.log(upper);',
            hint: '`title.trim()` e depois `clean.toUpperCase()`.',
            tests: [['`clean` sem espaços', 'clean === "Learn JavaScript"'], ['`upper` em maiúsculas', 'upper === "LEARN JAVASCRIPT"'], ['Mostra upper', '__logs.includes("LEARN JAVASCRIPT")']] }),
          learn('Procurando e recortando', `Mais methods úteis:

~~~
const email = "rick@mail.com";
email.includes("@")      // true  (contém?)
email.slice(0, 4)        // "rick" (do índice 0 até antes do 4)
email.replace("mail", "corp")  // "rick@corp.com"

As posições (**índices**) começam em **0**: o "r" é o índice 0, o "i" é o 1...`),

          code({ title: 'Analisando um email', task: 'Com o `email` pronto, crie:\n\n1. `hasAt`: se o email contém `"@"`\n2. `user`: os 4 primeiros caracteres\n\nE mostre os dois no console.',

            hint: '`email.includes("@")` e `email.slice(0, 4)`.',

        lesson('js-math', 'Números e Math',
          learn('O objeto Math', `O \`Math\` tem funções prontas pra números:

~~~

E pra transformar texto em número: \`Number("42")\` dá \`42\`. Se não der pra converter, vem \`NaN\` (Not a Number).`),

            tests: [['`avg` vale 8.3', 'avg === 8.3'], ['`best` vale 10', 'best === 10'], ['Mostra os dois', '__logs.includes("8.3") && __logs.includes("10")']] }))

          learn('Quem enxerga o quê', `**Scope** é onde uma variável existe. Variáveis criadas com \`let\`/\`const\` dentro de \`{ }\` só existem ali dentro.

function makeGreeter(greeting) {

          code({ title: 'Contador', task: 'Crie `makeCounter()` que retorna uma function. Cada chamada dessa function incrementa e **retorna** a contagem (1, 2, 3...). Dois contadores diferentes não podem compartilhar a contagem.',

          learn('Functions como valores', `Em JavaScript, functions são valores: dá pra guardar em variável, passar como argumento e retornar.

function repeat(times, action) {

          code({ title: 'Aplique duas vezes', task: 'Crie `applyTwice(fn, value)` que aplica `fn` em `value` e depois aplica `fn` de novo no resultado.\n\nEx: `applyTwice(n => n + 3, 1)` → `7`.',

Pra combinar condições:

Sem \`return\` ou \`break\`, o switch "cai" no próximo case. Casos empilhados (como acima) usam isso de propósito.`),

        lesson('js-truthy', 'Truthy, falsy, ?? e ?.',
          learn('Valores que "contam" como false', `Em condições, todo valor vira true ou false. Os **falsy** são poucos:

\`false\`, \`0\`, \`""\` (string vazia), \`null\`, \`undefined\` e \`NaN\`. Todo o resto é **truthy** (inclusive \`"0"\`, \`[]\` e \`{}\`).

Operadores muito usados no dia a dia:

~~~
const name = input || "Anonymous";  // usa o padrão se input for falsy
const qty  = value ?? 1;            // só se value for null/undefined
const city = user?.address?.city;   // não quebra se user ou address não existir
~~~

A diferença: \`0 || 1\` dá \`1\`, mas \`0 ?? 1\` dá \`0\`. O \`??\` respeita zero e string vazia.`),

const cities = ["Berlin", "Lisbon", "Toronto"];

cities.push("Dublin");     // adiciona no final
cities.pop();              // remove o último
cities.includes("Lisbon"); // true
cities.indexOf("Toronto"); // 2
cities.at(-1);             // último item
~~~

Mesmo com \`const\`, dá pra mudar o conteúdo do array. O que não dá é reatribuir a variável.`),

O \`while\` repete enquanto a condição for true:

- \`map\`: cria um array novo **transformando** cada item.

        learn('Agrupando dados', `Um **object** agrupa dados relacionados em pares chave: valor (as **properties**):

        code({ title: 'Implemente debounce', task: 'Crie `debounce(fn, ms)` que retorna uma function. Chamadas rápidas seguidas devem resultar em **uma** execução de `fn`, `ms` milissegundos após a última chamada, com os argumentos da última chamada.',

- **O(1)**: constante (acessar \`arr[5]\`, \`map.get(key)\`)
- **O(log n)**: divide o problema pela metade a cada passo (busca binária)
- **O(n)**: percorre tudo uma vez (\`find\`, \`includes\`)
- **O(n²)**: loop dentro de loop sobre os mesmos dados

**Busca binária** num array ordenado: olha o meio; se o alvo é maior, descarta a metade da esquerda; se é menor, a da direita. Com 1 milhão de itens, são no máximo ~20 passos.

let low = 0, high = arr.length - 1;
while (low <= high) {

}

        code({ title: 'Busca binária', task: 'Crie `binarySearch(sorted, target)` que retorna o **índice** de `target` num array **ordenado**, ou `-1` se não existir. Use busca binária (não use `indexOf`/`includes`/`find`).',

        code({ title: 'createInventory', task: 'Crie `createInventory()` que retorna um object com:\n\n- `add(name, qty, price)`: adiciona `qty` unidades (se o item já existe, soma a quantidade e atualiza o preço)\n- `remove(name, qty)`: tira unidades; lança `Error("Not enough stock")` se não houver o suficiente\n- `total()`: valor total em estoque (soma de qty × price)\n- `report()`: array de strings `"<name>: <qty>"` em ordem alfabética, sem itens zerados',

          solution: 'function createInventory() {\n  const items = new Map();\n  return {\n    add(name, qty, price) {\n      const current = items.get(name) || { qty: 0, price };\n      items.set(name, { qty: current.qty + qty, price });\n    },\n    remove(name, qty) {\n      const current = items.get(name);\n      if (!current || current.qty < qty) throw new Error("Not enough stock");\n      current.qty -= qty;\n    },\n    total() {\n      let sum = 0;\n      for (const { qty, price } of items.values()) sum += qty * price;\n      return sum;\n    },\n    report() {\n      return [...items.entries()]\n        .filter(([, item]) => item.qty > 0)\n        .sort(([a], [b]) => a.localeCompare(b))\n        .map(([name, item]) => `${name}: ${item.qty}`);\n    },\n  };\n}',

Tipos básicos: \`number\`, \`string\`, \`boolean\`, \`null\`, \`undefined\`.

Pra usar um union com segurança, cheque o tipo antes. Isso é **narrowing**:

          code({ title: 'Idade segura', task: 'Crie `parseAge(input: unknown): number | null`:\n\n- se for number, retorna ele\n- se for string que vira número válido (`"42"`), retorna o número\n- qualquer outra coisa → `null`\n\nNão use `any`.',

Também dá pra usar \`type\`:

type Point = { x: number; y: number };
~~~

Regra prática: \`interface\` pra objects; \`type\` pra unions e o resto.`),

            tests: [['pending', 'statusLabel("pending") === "Waiting for payment"'], ['paid', 'statusLabel("paid") === "Paid"'], ['canceled', 'statusLabel("canceled") === "Canceled"']] })),

type Shape =

function perimeter(s: Shape): number {

~~~

Outras formas de narrowing: \`typeof x === "string"\`, \`"prop" in obj\`, \`x instanceof Date\`, \`Array.isArray(x)\`.

É o padrão usado em reducers, eventos, respostas de API e state machines.`),

    unit('TypeScript na prática',
      lesson('ts-async', 'Async com tipos',
        learn('Promise<T>', `Functions \`async\` retornam \`Promise<T>\`:

~~~
interface User { id: number; name: string; }

async function getUser(id: number): Promise<User> {
  const res = await fetch(\`/api/users/\${id}\`);
  return res.json();   // cuidado: json() é any!
}
~~~

\`await\` desembrulha: dentro da function, \`await getUser(1)\` tem tipo \`User\`.

Atenção: dados que chegam da rede não são verificados pelo TypeScript em runtime. O tipo é uma **promessa sua**. Pra dados não confiáveis, valide (próxima lição).

Neste exercício existe \`api.getUser(id): Promise<User>\`.`),
        quiz('Qual o tipo de `x` em `const x = await getUser(1)` (com `getUser(): Promise<User>`)?', ['Promise<User>', 'User', 'any', 'Promise<any>'], 1, '`await` desembrulha a Promise.'),
        code({ title: 'Buscar nomes', task: 'Crie `async function getNames(ids: number[]): Promise<string[]>` que busca todos os usuários **em paralelo** com `api.getUser` e retorna os nomes.',

          prelude: 'const api = { async getUser(id) { await new Promise(r => setTimeout(r, 20)); return { id, name: ["Ana", "Lukas", "Marta"][id - 1] || "Guest" }; } };',
          starter: 'async function getNames(ids: number[]): Promise<string[]> {\n  // your code\n}\n',
          solution: 'async function getNames(ids: number[]): Promise<string[]> {\n  const users = await Promise.all(ids.map((id) => api.getUser(id)));\n  return users.map((u) => u.name);\n}',
          hint: '`Promise.all(ids.map(id => api.getUser(id)))` e depois `map` pros nomes.',
          typeTests: 'type _a = Expect<Equal<ReturnType<typeof getNames>, Promise<string[]>>>;',
          tests: [['[1, 2] → ["Ana", "Lukas"]', '(await getNames([1, 2])).join() === "Ana,Lukas"'], ['[] → []', '(await getNames([])).length === 0']], requires: [['Usa Promise.all', 'Promise\\.all']] })),

      lesson('ts-type-guards', 'Type guards',
        learn('Validando dados de fora', `Um **type guard** é uma function que verifica um valor em runtime e informa o TypeScript do resultado:

~~~
function isString(x: unknown): x is string {
  return typeof x === "string";
}

const data: unknown = JSON.parse(text);
if (isUser(data)) {
  data.name;   // TS sabe que é User aqui
}
~~~

O retorno \`x is User\` é o que transforma um boolean comum em narrowing.

Em projetos grandes, libs como **Zod** geram esses guards a partir de schemas. Mas entender o mecanismo é essencial.`),
        quiz('O que `value is User` no retorno de uma function faz?', ['Converte value pra User', 'Diz ao TS que, se retornar true, value é User', 'Lança erro se não for User', 'Nada, é comentário'], 1, 'É um type predicate: o resultado true estreita o tipo.'),
        code({ title: 'isUser', task: 'Crie `isUser(value: unknown): value is User` que retorna `true` só se `value` for um object (não null) com `name` string e `email` string.',
          starter: 'interface User {\n  name: string;\n  email: string;\n}\n\nfunction isUser(value: unknown): value is User {\n  // your code\n}\n',
          solution: 'interface User {\n  name: string;\n  email: string;\n}\n\nfunction isUser(value: unknown): value is User {\n  if (typeof value !== "object" || value === null) return false;\n  const v = value as { name?: unknown; email?: unknown };\n  return typeof v.name === "string" && typeof v.email === "string";\n}',
          hint: 'Cheque `typeof value === "object" && value !== null`, depois converta com `as { name?: unknown; email?: unknown }` e teste os campos.',
          typeTests: 'declare const __x: unknown;\nif (isUser(__x)) { const __n: string = __x.email; }',
          tests: [['User válido', 'isUser({ name: "Ana", email: "a@x.com" }) === true'], ['Sem email', 'isUser({ name: "Ana" }) === false'], ['null', 'isUser(null) === false'], ['string', 'isUser("Ana") === false'], ['email não-string', 'isUser({ name: "A", email: 5 }) === false']] })),

      lesson('ts-result', 'Result types',
        learn('Erros sem exceptions', `Em vez de lançar erro, muitas bases retornam um **Result**, que obriga quem chama a tratar o caso de falha:

~~~
type Result<T> =
  | { ok: true; value: T }
  | { ok: false; error: string };

function parsePort(s: string): Result<number> {
  const n = Number(s);
  if (!Number.isInteger(n)) return { ok: false, error: "Not a number" };
  return { ok: true, value: n };
}

const r = parsePort("8080");
if (r.ok) console.log(r.value);   // narrowing pelo discriminante ok
else console.log(r.error);
~~~`),
        quiz('Por que `r.value` só pode ser lido dentro de `if (r.ok)`?', ['Por convenção', 'Porque só o membro com ok: true tem value', 'Porque value é private', 'Não precisa de if'], 1, 'Discriminated union: só o lado de sucesso tem `value`.'),
        code({ title: 'Divisão segura', task: 'Com o `type Result<T>` pronto, crie `safeDivide(a: number, b: number): Result<number>`. Se `b` for 0, retorne `{ ok: false, error: "Division by zero" }`.',
          starter: 'type Result<T> =\n  | { ok: true; value: T }\n  | { ok: false; error: string };\n\nfunction safeDivide(a: number, b: number): Result<number> {\n  // your code\n}\n',
          solution: 'type Result<T> =\n  | { ok: true; value: T }\n  | { ok: false; error: string };\n\nfunction safeDivide(a: number, b: number): Result<number> {\n  if (b === 0) return { ok: false, error: "Division by zero" };\n  return { ok: true, value: a / b };\n}',
          hint: 'Dois returns: o caso de erro e `{ ok: true, value: a / b }`.',
          tests: [['6 / 3', '(() => { const r = safeDivide(6, 3); return r.ok === true && r.value === 2; })()'], ['Divisão por zero', '(() => { const r = safeDivide(1, 0); return r.ok === false && r.error === "Division by zero"; })()']] })),

      lesson('ts-final', 'Projeto final: gerenciador de tarefas',
        learn('Juntando tudo', `Hora de modelar um sistema pequeno, mas bem tipado:

- literal union pro status
- interface pra entidade
- class com campos privados
- \`Record\` pras estatísticas
- erros com mensagens claras

Pense nos tipos primeiro. Com eles certos, a implementação quase se escreve sozinha.`),
        code({ title: 'TaskManager', task: 'Crie:\n\n- `type Status = "todo" | "doing" | "done"`\n- `interface Task { id: number; title: string; status: Status }`\n- class `TaskManager` com:\n  - `add(title: string): Task` (ids 1, 2, 3...; status inicial `"todo"`)\n  - `move(id: number, status: Status): void` (lança `Error("Task not found")` se não existir)\n  - `byStatus(status: Status): Task[]`\n  - `stats(): Record<Status, number>`',
          starter: '// type Status ...\n// interface Task ...\n\nclass TaskManager {\n  // your code\n}\n',
          solution: 'type Status = "todo" | "doing" | "done";\n\ninterface Task {\n  id: number;\n  title: string;\n  status: Status;\n}\n\nclass TaskManager {\n  private tasks: Task[] = [];\n  private nextId = 1;\n\n  add(title: string): Task {\n    const task: Task = { id: this.nextId++, title, status: "todo" };\n    this.tasks.push(task);\n    return task;\n  }\n\n  move(id: number, status: Status): void {\n    const task = this.tasks.find((t) => t.id === id);\n    if (!task) throw new Error("Task not found");\n    task.status = status;\n  }\n\n  byStatus(status: Status): Task[] {\n    return this.tasks.filter((t) => t.status === status);\n  }\n\n  stats(): Record<Status, number> {\n    const result: Record<Status, number> = { todo: 0, doing: 0, done: 0 };\n    for (const t of this.tasks) result[t.status]++;\n    return result;\n  }\n}',
          hint: 'Guarde `private tasks: Task[] = []` e `private nextId = 1`. Em `stats`, comece com `{ todo: 0, doing: 0, done: 0 }`.',
          typeTests: 'type _s = Expect<Equal<Status, "todo" | "doing" | "done">>;\nconst __tm = new TaskManager();\n// @ts-expect-error status inválido\n__tm.move(1, "archived");\ntype _r = Expect<Equal<ReturnType<TaskManager["stats"]>, Record<Status, number>>>;',
          tests: [['add cria com id e status', '(() => { const m = new TaskManager(); const a = m.add("A"); const b = m.add("B"); return a.id === 1 && b.id === 2 && a.status === "todo"; })()'],
            ['move e byStatus', '(() => { const m = new TaskManager(); m.add("A"); m.add("B"); m.move(2, "done"); return m.byStatus("done").length === 1 && m.byStatus("todo")[0].title === "A"; })()'],
            ['move inexistente lança erro', '(() => { const m = new TaskManager(); try { m.move(9, "done"); return false; } catch (e) { return e.message === "Task not found"; } })()'],
            ['stats', '(() => { const m = new TaskManager(); m.add("A"); m.add("B"); m.move(1, "doing"); const s = m.stats(); return s.todo === 1 && s.doing === 1 && s.done === 0; })()']] }))
    )
  );
})(globalThis.TD = globalThis.TD || {});

  TD.courses.push({

    },
    units: [
      unit('Consultas',
        lesson('sql-select', 'SELECT',
          learn('Lendo uma tabela', `Um banco relacional guarda dados em **tables**: rows (linhas) e columns (colunas). Pra ler, use \`SELECT\`:

~~~

~~~

O \`*\` traz todas as columns. Pra escolher:

~~~

~~~

Keywords (\`SELECT\`, \`FROM\`) em maiúsculas são convenção; funciona em minúsculas também. O \`;\` separa comandos.`),
          quiz('O que `SELECT name FROM customers;` retorna?', ['Só a primeira row', 'A column name de todas as rows', 'Todas as columns', 'O número de customers'], 1, 'Sem filtro, vêm todas as rows, só com as columns pedidas.'),

        lesson('sql-where', 'WHERE',
          learn('Filtrando rows', `\`WHERE\` decide quais rows entram:

WHERE country = 'Brazil';
~~~

- Texto entre **aspas simples**: \`'Brazil'\`.
- Comparação: \`=\`, \`<>\` (diferente), \`>\`, \`<\`, \`>=\`, \`<=\`.`),
          quiz('Qual query retorna clientes com 40 anos ou mais?', ['... WHERE age > 40;', '... WHERE age >= 40;', '... IF age >= 40;', 'SELECT age >= 40 FROM customers;'], 1, '"40 ou mais" é `>= 40`.'),
          predict('Quantas rows essa query retorna? (no banco tem 2 clientes de Portugal: Marta e Sofia)', "SELECT name\nFROM customers\nWHERE country = 'Portugal';", ['0', '1', '2', 'Todas as 10'], 2, 'O WHERE deixa passar só as rows em que a condição é verdadeira: as duas de Portugal.'),
          code({ title: 'Clientes na Alemanha', task: 'Selecione `name` e `age` dos customers do país `\'Germany\'`.', starter: '-- write your query\n', solution: "SELECT name, age FROM customers WHERE country = 'Germany';", hint: "`WHERE country = 'Germany'`" })),

        lesson('sql-filters', 'AND, OR, IN e BETWEEN',
          learn('Filtros combinados', `~~~

WHERE country = 'Germany' AND age < 30;

WHERE country IN ('Brazil', 'Portugal');     -- qualquer um da lista

~~~

Cuidado com \`AND\` + \`OR\` juntos: \`AND\` tem prioridade. Use parênteses:

~~~`),
          quiz('`BETWEEN 10 AND 20` inclui o 20?', ['Sim', 'Não', 'Só no PostgreSQL', 'Depende do tipo'], 0, '`BETWEEN` é inclusivo nas duas pontas.'),
          code({ title: 'Pedidos médios', task: 'Selecione `id`, `amount` e `status` dos `orders` com `amount` entre 50 e 300 **e** status `\'delivered\'` ou `\'shipped\'`.',
            starter: '-- write your query\n', solution: "SELECT id, amount, status FROM orders WHERE amount BETWEEN 50 AND 300 AND status IN ('delivered', 'shipped');",
            hint: "`amount BETWEEN 50 AND 300 AND status IN ('delivered', 'shipped')`" })),

        lesson('sql-like-null', 'LIKE e NULL',
          learn('Padrões e valores ausentes', `\`LIKE\` busca padrões em texto:

- \`%\` qualquer sequência de caracteres
- \`_\` exatamente um caractere

~~~
SELECT name FROM customers WHERE name LIKE 'M%';      -- começa com M
SELECT name FROM customers WHERE email LIKE '%.de';   -- termina com .de
~~~

**NULL** significa "sem valor". Ele não é igual a nada, nem a outro NULL. Por isso \`= NULL\` nunca funciona:

~~~
SELECT name FROM customers WHERE email IS NULL;
SELECT name FROM customers WHERE email IS NOT NULL;
~~~`),
          quiz('Quantas rows `WHERE email = NULL` retorna?', ['As que não têm email', 'Todas', 'Nenhuma', 'Dá erro'], 2, 'Comparar com NULL usando `=` nunca dá true. Use `IS NULL`.'),

          code({ title: 'Os 3 mais velhos', task: 'Mostre `name` e `age` dos **3 customers mais velhos**, do mais velho pro mais novo.', starter: '-- write your query\n', solution: 'SELECT name, age FROM customers ORDER BY age DESC LIMIT 3;', ordered: true, hint: '`ORDER BY age DESC LIMIT 3`' })),

        lesson('sql-distinct-alias', 'DISTINCT e aliases',

~~~

\`AS\` dá um **alias** (apelido) pra column ou tabela:

~~~

~~~

Dá pra fazer contas e juntar textos no SELECT: \`price * 0.9\`, \`name || ' (' || country || ')'\`.`),

          code({ title: 'Categorias e preços', task: 'Liste as categorias de produto **sem repetir**, em ordem alfabética, com a column chamada `category`.', starter: '-- write your query\n', solution: 'SELECT DISTINCT category FROM products ORDER BY category;', ordered: true, checkColumns: true, hint: '`SELECT DISTINCT category ... ORDER BY category`' }),
          code({ title: 'Preço com desconto', task: 'Mostre `name` e o preço com 10% de desconto como `sale_price` para todos os produtos.', starter: '-- write your query\n', solution: 'SELECT name, price * 0.9 AS sale_price FROM products;', checkColumns: true, hint: '`price * 0.9 AS sale_price`' }))
      ),

      unit('Agregação',
        lesson('sql-aggregate', 'COUNT, SUM, AVG, MIN, MAX',
          learn('Resumindo dados', `**Aggregate functions** resumem várias rows num valor:

~~~
SELECT COUNT(*) FROM orders;          -- quantas rows
SELECT COUNT(email) FROM customers;   -- quantas com email NÃO nulo
SELECT SUM(amount) FROM orders;
SELECT AVG(age) FROM customers;

~~~

Combine com WHERE e alias:

~~~
SELECT SUM(amount) AS revenue
FROM orders
WHERE status = 'delivered';
~~~`),
          quiz('Qual a diferença entre `COUNT(*)` e `COUNT(email)`?', ['Nenhuma', 'COUNT(email) ignora rows com email NULL', 'COUNT(*) ignora NULL', 'COUNT(email) conta emails únicos'], 1, '`COUNT(coluna)` só conta valores não nulos.'),
          predict('O que essa query retorna?', 'SELECT COUNT(*), MAX(age)\nFROM customers;', ['Uma row por cliente', 'Uma única row com 2 valores', 'Duas rows', 'Um erro: faltou GROUP BY'], 1, 'Sem GROUP BY, as aggregate functions resumem a tabela inteira numa row só.'),
          code({ title: 'Faturamento', task: 'Calcule a soma de `amount` dos orders com status `\'delivered\'`, com a column chamada `revenue`.', starter: '-- write your query\n', solution: "SELECT SUM(amount) AS revenue FROM orders WHERE status = 'delivered';", checkColumns: true, hint: "`SELECT SUM(amount) AS revenue FROM orders WHERE status = 'delivered';`" })),

        lesson('sql-groupby', 'GROUP BY',
          learn('Um resumo por grupo', `\`GROUP BY\` aplica a aggregate **para cada grupo**:

~~~
SELECT country, COUNT(*) AS total
FROM customers
GROUP BY country;
~~~

Regra: toda column no SELECT que não está numa aggregate precisa estar no GROUP BY.`),
          quiz('Em `SELECT status, SUM(amount) FROM orders GROUP BY status`, quantas rows vêm?', ['Uma por pedido', 'Uma por status diferente', 'Uma só', 'Depende do amount'], 1, 'Uma row pra cada grupo.'),
          predict('Se existem clientes de 4 países, quantas rows saem?', 'SELECT country, COUNT(*)\nFROM customers\nGROUP BY country;', ['1', '4', 'Uma por cliente', '0'], 1, 'GROUP BY cria um grupo por valor distinto de country: 4 países, 4 rows.'),
          code({ title: 'Clientes por país', task: 'Mostre cada `country` e quantos customers ele tem, numa column `total`, do país com mais clientes pro com menos (empate: ordem alfabética do país).',
            starter: '-- write your query\n', solution: 'SELECT country, COUNT(*) AS total FROM customers GROUP BY country ORDER BY total DESC, country;', ordered: true, checkColumns: true, hint: '`GROUP BY country ORDER BY total DESC, country`' })),

        lesson('sql-having', 'HAVING',
          learn('Filtrando grupos', `\`WHERE\` filtra **rows antes** de agrupar. \`HAVING\` filtra **grupos depois**:

~~~
SELECT customer_id, SUM(amount) AS spent
FROM orders
WHERE status <> 'canceled'      -- tira pedidos cancelados
GROUP BY customer_id
HAVING SUM(amount) > 500;       -- só quem gastou mais de 500
~~~

Ordem completa: \`SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT\`.`),
          quiz('Onde filtrar "países com mais de 2 clientes"?', ['WHERE COUNT(*) > 2', 'HAVING COUNT(*) > 2', 'LIMIT 2', 'ORDER BY COUNT(*)'], 1, 'Condição sobre a aggregate vai no HAVING.'),
          quiz('Qual a diferença entre WHERE e HAVING?', ['Nenhuma', 'WHERE filtra rows antes de agrupar; HAVING filtra grupos depois', 'HAVING só funciona com JOIN', 'WHERE só funciona com números'], 1, 'WHERE age sobre rows individuais; HAVING sobre o resultado de GROUP BY, por isso aceita COUNT/SUM.'),
          code({ title: 'Bons clientes', task: 'Ignorando pedidos `\'canceled\'`, mostre `customer_id` e o total gasto como `spent`, só para quem gastou **mais de 200**.',
            starter: '-- write your query\n', solution: "SELECT customer_id, SUM(amount) AS spent FROM orders WHERE status <> 'canceled' GROUP BY customer_id HAVING SUM(amount) > 200;", checkColumns: true, hint: "WHERE pra tirar os cancelados, GROUP BY customer_id, HAVING SUM(amount) > 200." }))
      ),

      unit('JOINs',
        lesson('sql-join', 'INNER JOIN',
          learn('Juntando tables', `Os pedidos guardam só \`customer_id\`. Pra trazer o nome, junte as tables com \`JOIN\`:

~~~
SELECT c.name, o.amount
FROM orders o
JOIN customers c ON c.id = o.customer_id;
~~~

- \`o\` e \`c\` são aliases das tables.
- \`ON\` diz como as rows se conectam (chave estrangeira → chave primária).
- \`JOIN\` (= \`INNER JOIN\`) só traz rows com par nas duas tables.`),
          quiz('O que `ON c.id = o.customer_id` faz?', ['Ordena', 'Liga cada pedido ao seu cliente', 'Filtra o Brasil', 'Cria uma table'], 1, 'É a condição de ligação entre as tables.'),
          code({ title: 'Quem comprou o quê', task: 'Liste o `name` do cliente e o `name` do produto de cada pedido de clientes da `\'Germany\'`. Chame as columns de `customer` e `product`.',
            starter: '-- write your query\n', solution: "SELECT c.name AS customer, p.name AS product FROM orders o JOIN customers c ON c.id = o.customer_id JOIN products p ON p.id = o.product_id WHERE c.country = 'Germany';", checkColumns: true,
            hint: 'Dois JOINs: `customers c ON c.id = o.customer_id` e `products p ON p.id = o.product_id`.' })),

        lesson('sql-left-join', 'LEFT JOIN',
          learn('Incluindo quem não tem par', `\`LEFT JOIN\` mantém **todas** as rows da table da esquerda, mesmo sem par. Onde não há par, as columns da direita vêm \`NULL\`:

~~~
SELECT c.name, o.id AS order_id
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id;
~~~

Truque clássico: achar quem **não tem** par:

~~~
SELECT c.name
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
WHERE o.id IS NULL;      -- clientes sem nenhum pedido
~~~`),
          quiz('No LEFT JOIN, o que vem nas columns da direita quando não há par?', ['0', "''", 'NULL', 'A row é removida'], 2, 'Sem par, a direita vem NULL.'),
          code({ title: 'Produtos encalhados', task: 'Liste o `name` dos produtos que **nunca** foram pedidos.', starter: '-- write your query\n', solution: 'SELECT p.name FROM products p LEFT JOIN orders o ON o.product_id = p.id WHERE o.id IS NULL;', hint: '`LEFT JOIN orders` e `WHERE o.id IS NULL`.' }),
          code({ title: 'Pedidos por cliente', task: 'Mostre o `name` de **todos** os customers e quantos pedidos cada um fez como `orders_count` (inclusive quem fez 0).',
            starter: '-- write your query\n', solution: 'SELECT c.name, COUNT(o.id) AS orders_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name;', checkColumns: true,
            hint: 'LEFT JOIN + `COUNT(o.id)` (não `COUNT(*)`, que contaria 1 pra quem não tem pedido).' })),

        lesson('sql-multi-join', 'JOINs com agregação',
          learn('Perguntas de negócio', `A maioria das perguntas reais combina JOIN + GROUP BY:

~~~
SELECT p.category, SUM(o.amount) AS revenue
FROM orders o
JOIN products p ON p.id = o.product_id
WHERE o.status <> 'canceled'
GROUP BY p.category
ORDER BY revenue DESC;
~~~

Monte em etapas: primeiro o JOIN, confira as rows; depois agrupe.`),
          quiz('Em qual etapa o WHERE é aplicado numa query com JOIN e GROUP BY?', ['Depois do GROUP BY', 'Antes do GROUP BY, nas rows já juntadas', 'Antes do JOIN', 'No final, depois do ORDER BY'], 1, 'FROM/JOIN montam as rows, WHERE filtra, depois GROUP BY agrupa.'),
          code({ title: 'Faturamento por categoria', task: 'Ignorando pedidos cancelados, mostre cada `category` e o faturamento como `revenue`, do maior pro menor.',
            starter: '-- write your query\n', solution: "SELECT p.category, SUM(o.amount) AS revenue FROM orders o JOIN products p ON p.id = o.product_id WHERE o.status <> 'canceled' GROUP BY p.category ORDER BY revenue DESC;", ordered: true, checkColumns: true,
            hint: "JOIN products, `WHERE o.status <> 'canceled'`, `GROUP BY p.category`, `ORDER BY revenue DESC`." })),

        lesson('sql-self-join', 'Self join',
          learn('Uma table com ela mesma', `Às vezes uma table aponta pra si mesma. Em \`employees\`, \`manager_id\` é o id de outro employee. Pra mostrar o nome do gestor, junte a table com ela mesma usando aliases diferentes:

~~~
SELECT e.name AS employee, m.name AS manager
FROM employees e
LEFT JOIN employees m ON m.id = e.manager_id;
~~~

O LEFT JOIN mantém quem não tem gestor (os chefes de departamento).`),
          quiz('Por que usar aliases diferentes (`e` e `m`) no self join?', ['É opcional', 'Pra distinguir as duas "cópias" da mesma table', 'Pra deixar mais rápido', 'Porque JOIN exige'], 1, 'Sem aliases distintos, o banco não sabe de qual lado é cada column.'),
          code({ db: 'hr', title: 'Quem é o gestor', task: 'Liste cada employee e o nome do gestor, com as columns `employee` e `manager`. Quem não tem gestor deve aparecer com `manager` NULL.',
            starter: '-- write your query\n', solution: 'SELECT e.name AS employee, m.name AS manager FROM employees e LEFT JOIN employees m ON m.id = e.manager_id;', checkColumns: true, hint: '`FROM employees e LEFT JOIN employees m ON m.id = e.manager_id`' }))
      ),

      unit('Subqueries e CTEs',
        lesson('sql-subquery', 'Subqueries',
          learn('Query dentro de query', `Uma **subquery** é um SELECT dentro de outro:

~~~
-- produtos mais caros que a média
SELECT name, price FROM products
WHERE price > (SELECT AVG(price) FROM products);

-- clientes que já compraram
SELECT name FROM customers
WHERE id IN (SELECT customer_id FROM orders);
~~~

Também existe \`EXISTS\`, que testa se a subquery retorna alguma row:

~~~
SELECT name FROM customers c
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);
~~~`),
          quiz('O que `(SELECT AVG(price) FROM products)` retorna?', ['Uma table inteira', 'Um único valor', 'Uma lista de preços', 'Nada'], 1, 'É uma subquery escalar: um valor só, usado na comparação.'),
          code({ db: 'hr', title: 'Acima da média', task: 'Liste `name` e `salary` dos employees que ganham **mais que a média** da empresa.', starter: '-- write your query\n', solution: 'SELECT name, salary FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);', hint: '`WHERE salary > (SELECT AVG(salary) FROM employees)`' })),

        lesson('sql-subquery-correlated', 'Subqueries correlacionadas',
          learn('Subquery que olha pra fora', `Uma subquery **correlacionada** usa columns da query de fora, então roda "uma vez por row":

~~~
-- quem ganha mais que a média do PRÓPRIO departamento
SELECT e.name, e.salary
FROM employees e
WHERE e.salary > (
  SELECT AVG(x.salary) FROM employees x WHERE x.dept_id = e.dept_id
);
~~~

Também dá pra usar subquery no FROM, como uma table temporária (**derived table**):

~~~
SELECT AVG(total) FROM (
  SELECT customer_id, SUM(amount) AS total FROM orders GROUP BY customer_id
) AS t;
~~~`),
          quiz('O que torna uma subquery "correlacionada"?', ['Ter JOIN', 'Usar uma column da query de fora', 'Estar no FROM', 'Usar GROUP BY'], 1, 'Ela depende da row atual da query externa.'),
          code({ db: 'hr', title: 'Maior salário do departamento', task: 'Liste `name`, `dept_id` e `salary` de quem tem o **maior salário do próprio departamento**.',
            starter: '-- write your query\n', solution: 'SELECT e.name, e.dept_id, e.salary FROM employees e WHERE e.salary = (SELECT MAX(x.salary) FROM employees x WHERE x.dept_id = e.dept_id);', hint: '`WHERE e.salary = (SELECT MAX(x.salary) FROM employees x WHERE x.dept_id = e.dept_id)`' })),

        lesson('sql-cte', 'CTEs com WITH',
          learn('Queries legíveis', `Uma **CTE** (Common Table Expression) dá nome a uma subquery, deixando a query principal limpa:

~~~
WITH spending AS (
  SELECT customer_id, SUM(amount) AS total
  FROM orders
  WHERE status <> 'canceled'
  GROUP BY customer_id
)
SELECT c.name, s.total
FROM spending s
JOIN customers c ON c.id = s.customer_id
ORDER BY s.total DESC;
~~~

Dá pra encadear várias: \`WITH a AS (...), b AS (...) SELECT ...\`. Em análises de dados, CTEs são o padrão.`),
          quiz('Qual a principal vantagem de uma CTE?', ['É sempre mais rápida', 'Organiza a query em etapas com nome', 'Cria uma table permanente', 'Substitui índices'], 1, 'Legibilidade: cada etapa ganha um nome.'),
          code({ title: 'Top 3 clientes', task: 'Usando uma CTE `spending` (total gasto por cliente, sem pedidos cancelados), mostre `name` e `total` dos **3 clientes que mais gastaram**, do maior pro menor.',
            starter: 'WITH spending AS (\n  -- your code\n)\nSELECT ...\n', solution: "WITH spending AS (\n  SELECT customer_id, SUM(amount) AS total FROM orders WHERE status <> 'canceled' GROUP BY customer_id\n)\nSELECT c.name, s.total FROM spending s JOIN customers c ON c.id = s.customer_id ORDER BY s.total DESC LIMIT 3;",
            ordered: true, checkColumns: true, requires: [['Usa WITH', '^\\s*WITH\\b']], hint: 'Na CTE, agrupe por customer_id; fora, JOIN customers, ORDER BY total DESC LIMIT 3.' }))
      )
    ]
  });
})(globalThis.TD = globalThis.TD || {});
